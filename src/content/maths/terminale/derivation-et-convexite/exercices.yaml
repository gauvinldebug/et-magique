# Exercices corrigés, du plus facile au type bac.
# type d'étape : init (vert), her (orange), conc (bleu), calcul, methode, piege (rouge)
exercices:
  - titre: Dériver des composées
    difficulte: 1
    type: application
    enonce: |
      Dériver les fonctions suivantes.
      1. $\cbleu{f}(\corange{x}) = \mathrm{e}^{\corange{x}^2 - 3\corange{x}}$
      2. $g(\corange{x}) = (2\corange{x} + 5)^3$
      3. $h(\corange{x}) = \sqrt{4\corange{x} + 1}$ sur $\left]-\frac{1}{4}\,;+\infty\right[$
    indice: Repère à chaque fois la fonction $u$ à l'intérieur, et calcule $u'$.
    etapes:
      - type: calcul
        titre: Question 1
        texte: >-
          $u = \corange{x}^2 - 3\corange{x}$, $u' = 2\corange{x} - 3$, donc $\cbleu{f}'(\corange{x}) = (2\corange{x} - 3)\,\mathrm{e}^{\corange{x}^2 - 3\corange{x}}$.
      - type: calcul
        titre: Question 2
        texte: >-
          $u = 2\corange{x} + 5$, $u' = 2$, donc $g'(\corange{x}) = 3 \times 2 \times (2\corange{x} + 5)^2 = 6(2\corange{x} + 5)^2$.
      - type: calcul
        titre: Question 3
        texte: >-
          $u = 4\corange{x} + 1$, $u' = 4$, donc $h'(\corange{x}) = \dfrac{4}{2\sqrt{4\corange{x} + 1}} = \dfrac{2}{\sqrt{4\corange{x} + 1}}$.
        note: ne jamais oublier u'

  - titre: Convexité d'un polynôme
    difficulte: 1
    type: methode
    enonce: |
      Soit $\cbleu{f}(\corange{x}) = \corange{x}^3 + 3\corange{x}^2 - 2$. Étudier la convexité de $\cbleu{f}$ et donner son point d'inflexion.
    indice: Calcule $\cbleu{f}''$ et étudie son signe.
    etapes:
      - type: calcul
        titre: Les dérivées
        texte: $\cbleu{f}'(\corange{x}) = 3\corange{x}^2 + 6\corange{x}$ et $\cbleu{f}''(\corange{x}) = 6\corange{x} + 6 = 6(\corange{x} + 1)$.
      - type: methode
        titre: Le signe de f''
        texte: $\cbleu{f}''(\corange{x}) \le 0$ pour $\corange{x} \le -1$ et $\cbleu{f}''(\corange{x}) \ge 0$ pour $\corange{x} \ge -1$.
        note: le volant change de sens en -1
      - type: conc
        titre: Conclusion
        texte: >-
          $\cbleu{f}$ est concave sur $]-\infty\,;-1]$ et convexe sur $[-1\,;+\infty[$. $\cbleu{f}''$ s'annule en changeant de signe en $-1$ et $\cbleu{f}(-1) = -1 + 3 - 2 = 0$ : <mark>le point $(-1\,;0)$ est un point d'inflexion</mark>.

  - titre: Convexité avec une exponentielle
    difficulte: 2
    type: methode
    enonce: |
      Soit $\cbleu{f}(\corange{x}) = \corange{x}\,\mathrm{e}^{\corange{x}}$ sur $\mathbb{R}$.
      1. Calculer $\cbleu{f}'(\corange{x})$ et $\cbleu{f}''(\corange{x})$.
      2. Étudier la convexité de $\cbleu{f}$.
    indice: Dérivée d'un produit, $(uv)' = u'v + uv'$. Factorise par $\mathrm{e}^{\corange{x}}$.
    etapes:
      - type: calcul
        titre: La dérivée
        texte: $\cbleu{f}'(\corange{x}) = 1 \times \mathrm{e}^{\corange{x}} + \corange{x}\,\mathrm{e}^{\corange{x}} = (\corange{x} + 1)\,\mathrm{e}^{\corange{x}}$.
      - type: calcul
        titre: La dérivée seconde
        texte: $\cbleu{f}''(\corange{x}) = \mathrm{e}^{\corange{x}} + (\corange{x} + 1)\,\mathrm{e}^{\corange{x}} = (\corange{x} + 2)\,\mathrm{e}^{\corange{x}}$.
      - type: methode
        titre: Le signe
        texte: $\mathrm{e}^{\corange{x}} > 0$, donc $\cbleu{f}''$ est du signe de $\corange{x} + 2$.
        note: l'exponentielle est toujours positive
      - type: conc
        titre: Conclusion
        texte: >-
          <mark>$\cbleu{f}$ est concave sur $]-\infty\,;-2]$ et convexe sur $[-2\,;+\infty[$</mark>. Point d'inflexion en $\left(-2\,;-2\mathrm{e}^{-2}\right)$.

  - titre: Position par rapport à une tangente
    difficulte: 2
    type: application
    enonce: |
      Soit $g$ définie sur $\mathbb{R}$ par $g(\corange{x}) = \mathrm{e}^{2\corange{x}}$.
      1. Déterminer l'équation de la tangente $T$ à la courbe de $g$ au point d'abscisse 0.
      2. Justifier que la courbe de $g$ est au-dessus de $T$ sur $\mathbb{R}$.
    indice: Une fonction convexe est au-dessus de ses tangentes.
    etapes:
      - type: calcul
        titre: La tangente
        texte: >-
          $g'(\corange{x}) = 2\mathrm{e}^{2\corange{x}}$, donc $g'(0) = 2$ et $g(0) = 1$. $T$ a pour équation $y = 2(\corange{x} - 0) + 1$, soit $y = 2\corange{x} + 1$.
      - type: calcul
        titre: La convexité
        texte: $g''(\corange{x}) = 4\mathrm{e}^{2\corange{x}} > 0$ sur $\mathbb{R}$, donc $g$ est convexe sur $\mathbb{R}$.
      - type: conc
        titre: Conclusion
        texte: Une fonction convexe est au-dessus de ses tangentes, donc <mark>$\mathrm{e}^{2\corange{x}} \ge 2\corange{x} + 1$ pour tout réel $\corange{x}$</mark>.

  - titre: Lire la convexité sur f'
    difficulte: 2
    type: piege
    enonce: |
      On donne le tableau de variations de la **dérivée** $\cbleu{f}'$ : $\cbleu{f}'$ est croissante sur $]-\infty\,;2]$ et décroissante sur $[2\,;+\infty[$, avec $\cbleu{f}'(2) = -1$.
      1. Étudier la convexité de $\cbleu{f}$.
      2. Un élève dit : « $\cbleu{f}'$ est croissante sur $]-\infty\,;2]$, donc $\cbleu{f}$ est croissante sur cet intervalle. » A-t-il raison ?
    indice: Les variations de $\cbleu{f}'$ donnent la convexité, le signe de $\cbleu{f}'$ donne les variations de $\cbleu{f}$.
    etapes:
      - type: calcul
        titre: Question 1
        texte: >-
          $\cbleu{f}'$ croissante sur $]-\infty\,;2]$, donc $\cbleu{f}$ est convexe sur cet intervalle. $\cbleu{f}'$ décroissante sur $[2\,;+\infty[$, donc $\cbleu{f}$ est concave. Le point d'abscisse 2 est un point d'inflexion.
      - type: piege
        titre: Question 2
        texte: >-
          L'élève confond pente et volant. $\cbleu{f}'$ atteint son maximum en 2 et ce maximum vaut $-1$ : donc $\cbleu{f}'(\corange{x}) \le -1 < 0$ partout.
        note: le maximum de f' est négatif
      - type: conc
        titre: Conclusion
        texte: <mark>$\cbleu{f}$ est décroissante sur $\mathbb{R}$</mark>, même là où elle est convexe. L'élève a tort.

  - titre: Étude complète type bac
    difficulte: 3
    type: bac
    enonce: |
      Soit $\cbleu{f}$ définie sur $\mathbb{R}$ par $\cbleu{f}(\corange{x}) = (\corange{x}^2 - 3)\,\mathrm{e}^{\corange{x}}$.
      1. Montrer que $\cbleu{f}'(\corange{x}) = (\corange{x}^2 + 2\corange{x} - 3)\,\mathrm{e}^{\corange{x}}$ et étudier les variations de $\cbleu{f}$.
      2. Montrer que $\cbleu{f}''(\corange{x}) = (\corange{x}^2 + 4\corange{x} - 1)\,\mathrm{e}^{\corange{x}}$.
      3. En déduire le nombre de points d'inflexion de la courbe.
    indice: >-
      $\corange{x}^2 + 2\corange{x} - 3 = (\corange{x} - 1)(\corange{x} + 3)$. Pour $\corange{x}^2 + 4\corange{x} - 1$, calcule le discriminant.
    etapes:
      - type: calcul
        titre: Question 1, la dérivée
        texte: >-
          $\cbleu{f}'(\corange{x}) = 2\corange{x}\,\mathrm{e}^{\corange{x}} + (\corange{x}^2 - 3)\,\mathrm{e}^{\corange{x}} = (\corange{x}^2 + 2\corange{x} - 3)\,\mathrm{e}^{\corange{x}}$.
      - type: calcul
        titre: Question 1, les variations
        texte: >-
          $\cbleu{f}'(\corange{x}) = (\corange{x} - 1)(\corange{x} + 3)\,\mathrm{e}^{\corange{x}}$, du signe de $(\corange{x} - 1)(\corange{x} + 3)$. $\cbleu{f}$ est croissante sur $]-\infty\,;-3]$, décroissante sur $[-3\,;1]$, croissante sur $[1\,;+\infty[$.
      - type: calcul
        titre: Question 2
        texte: >-
          $\cbleu{f}''(\corange{x}) = (2\corange{x} + 2)\,\mathrm{e}^{\corange{x}} + (\corange{x}^2 + 2\corange{x} - 3)\,\mathrm{e}^{\corange{x}} = (\corange{x}^2 + 4\corange{x} - 1)\,\mathrm{e}^{\corange{x}}$.
      - type: methode
        titre: Question 3, le signe de f''
        texte: >-
          $\Delta = 16 + 4 = 20 > 0$. Le trinôme a deux racines, $-2 - \sqrt{5}$ et $-2 + \sqrt{5}$, et change de signe en chacune.
        note: un trinôme change de signe en chaque racine simple
      - type: conc
        titre: Conclusion
        texte: <mark>La courbe a deux points d'inflexion</mark>, d'abscisses $-2 - \sqrt{5}$ et $-2 + \sqrt{5}$. $\cbleu{f}$ est convexe sur $]-\infty\,;-2-\sqrt{5}]$ et sur $[-2+\sqrt{5}\,;+\infty[$, concave entre les deux.
