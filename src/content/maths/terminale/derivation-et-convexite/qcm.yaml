questions:
  - question: Quelle est la dérivée de $\mathrm{e}^{-2\corange{x}}$ ?
    choix: ['$\mathrm{e}^{-2\corange{x}}$', '$-2\mathrm{e}^{-2\corange{x}}$', '$-2\corange{x}\,\mathrm{e}^{-2\corange{x}}$', '$2\mathrm{e}^{-2\corange{x}}$']
    bonne: 1
    explication: $(\mathrm{e}^{u})' = u'\mathrm{e}^{u}$ avec $u = -2\corange{x}$ et $u' = -2$.
    revoir: cours

  - question: Quelle est la dérivée de $\sqrt{\corange{x}^2 + 1}$ ?
    choix: ['$\dfrac{1}{2\sqrt{\corange{x}^2 + 1}}$', '$\dfrac{\corange{x}}{\sqrt{\corange{x}^2 + 1}}$', '$\dfrac{2\corange{x}}{\sqrt{\corange{x}^2 + 1}}$', '$2\corange{x}\sqrt{\corange{x}^2 + 1}$']
    bonne: 1
    explication: $(\sqrt{u})' = \frac{u'}{2\sqrt{u}} = \frac{2\corange{x}}{2\sqrt{\corange{x}^2 + 1}} = \frac{\corange{x}}{\sqrt{\corange{x}^2 + 1}}$.
    revoir: cours

  - question: Quelle est la dérivée de $(3\corange{x} - 1)^4$ ?
    choix: ['$4(3\corange{x} - 1)^3$', '$12(3\corange{x} - 1)^3$', '$3(3\corange{x} - 1)^4$', '$12(3\corange{x} - 1)^4$']
    bonne: 1
    explication: $(u^n)' = n\,u'\,u^{n-1} = 4 \times 3 \times (3\corange{x} - 1)^3$.
    revoir: cours

  - question: Si $\cbleu{f}'' > 0$ sur $I$, alors $\cbleu{f}$ est…
    choix: ["croissante sur $I$", "convexe sur $I$", "concave sur $I$", "positive sur $I$"]
    bonne: 1
    explication: Le signe de $\cbleu{f}''$ donne la convexité (le sens du volant), pas les variations de $\cbleu{f}$.
    revoir: cours

  - question: Une fonction convexe sur $I$ a sa courbe…
    choix:
      - au-dessus de ses tangentes
      - en dessous de ses tangentes
      - au-dessus de ses cordes
      - toujours au-dessus de l'axe des abscisses
    bonne: 0
    explication: Convexe, c'est le bol, posé sur ses tangentes. En revanche, il passe sous ses cordes.
    revoir: cours

  - question: $\cbleu{f}''(\corange{x}) = \corange{x} - 2$. La courbe de $\cbleu{f}$ a un point d'inflexion d'abscisse…
    choix: ['$0$', '$2$', '$-2$', "aucun"]
    bonne: 1
    explication: $\cbleu{f}''$ s'annule en 2 en changeant de signe (négative avant, positive après).
    revoir: exercices

  - question: Laquelle de ces inégalités est vraie pour tout réel $\corange{x}$ ?
    choix: ['$\mathrm{e}^{\corange{x}} \le \corange{x} + 1$', '$\mathrm{e}^{\corange{x}} \ge \corange{x} + 1$', '$\mathrm{e}^{\corange{x}} \ge \corange{x} + 2$', '$\mathrm{e}^{\corange{x}} \ge 2\corange{x}$ seulement pour $\corange{x} > 0$']
    bonne: 1
    explication: L'exponentielle est convexe, sa courbe est au-dessus de sa tangente en 0, la droite $y = \corange{x} + 1$.
    revoir: cours

  - question: La fonction $\corange{x} \mapsto \corange{x}^4$ en 0…
    choix:
      - a un point d'inflexion, car $\cbleu{f}''(0) = 0$
      - n'a pas de point d'inflexion, car $\cbleu{f}''$ ne change pas de signe
      - n'est pas dérivable
      - est concave
    bonne: 1
    explication: $\cbleu{f}''(\corange{x}) = 12\corange{x}^2 \ge 0$ partout. Elle s'annule en 0 sans changer de signe, donc pas d'inflexion.
    revoir: cours
