questions:
  - question: Une fonction continue sur un intervalle, c'est une fonction…
    choix:
      - dont on trace la courbe sans lever le crayon
      - toujours croissante
      - toujours dérivable
      - qui ne s'annule jamais
    bonne: 0
    explication: C'est l'image du crayon. Continue ne veut dire ni monotone, ni dérivable.
    revoir: cours

  - question: Le TVI garantit que l'équation $\cbleu{f}(\corange{x}) = k$ a…
    choix: ["aucune solution", "au moins une solution", "exactement une solution", "deux solutions"]
    bonne: 1
    explication: Le TVI seul donne au moins une solution. Pour l'unicité, il faut la stricte monotonie (corollaire).
    revoir: cours

  - question: Laquelle de ces affirmations est vraie ?
    choix:
      - Toute fonction continue est dérivable.
      - Toute fonction dérivable est continue.
      - Une fonction continue est monotone.
      - Une fonction monotone est continue.
    bonne: 1
    explication: Dérivable implique continue. La réciproque est fausse, par exemple $|\corange{x}|$ en 0.
    revoir: cours

  - question: $\cbleu{f}$ est continue sur $[1\,;4]$, $\cbleu{f}(1) = 5$ et $\cbleu{f}(4) = -2$. On peut affirmer que…
    choix:
      - $\cbleu{f}$ s'annule au moins une fois sur $[1\,;4]$
      - $\cbleu{f}$ s'annule exactement une fois sur $[1\,;4]$
      - $\cbleu{f}$ est décroissante sur $[1\,;4]$
      - $\cbleu{f}(2) = 0$
    bonne: 0
    explication: 0 est compris entre $-2$ et $5$, donc le TVI donne au moins une solution. On ne sait rien sur la monotonie.
    revoir: exercices

  - question: Pour appliquer le corollaire du TVI, il faut que $\cbleu{f}$ soit…
    choix:
      - continue seulement
      - strictement monotone seulement
      - continue et strictement monotone
      - positive
    bonne: 2
    explication: Les deux conditions sont nécessaires, et $k$ doit être compris entre les images des bornes.
    revoir: cours

  - question: On a $\cbleu{f}(1{,}3) = -0{,}2$ et $\cbleu{f}(1{,}4) = 0{,}1$, avec $\cbleu{f}$ continue et strictement croissante. La solution $\alpha$ de $\cbleu{f}(\corange{x}) = 0$ vérifie…
    choix: ['$1{,}2 < \alpha < 1{,}3$', '$1{,}3 < \alpha < 1{,}4$', '$\alpha = 1{,}35$', '$\alpha > 1{,}4$']
    bonne: 1
    explication: Le signe change entre $1{,}3$ et $1{,}4$, c'est là que le crayon traverse la rivière.
    revoir: cours

  - question: La suite définie par $\unn = \sqrt{\un + 6}$ converge vers $\ell \ge 0$. Alors $\ell$ vaut…
    choix: ['$2$', '$3$', '$6$', '$\sqrt{6}$']
    bonne: 1
    explication: >-
      La fonction $\corange{x} \mapsto \sqrt{\corange{x} + 6}$ est continue, donc $\ell = \sqrt{\ell + 6}$, soit $\ell^2 - \ell - 6 = 0$. Les solutions sont $3$ et $-2$, et $\ell \ge 0$, donc $\ell = 3$.
    revoir: cours

  - question: La fonction partie entière est…
    choix:
      - continue sur $\mathbb{R}$
      - continue en chaque entier
      - non continue en chaque entier
      - dérivable sur $\mathbb{R}$
    bonne: 2
    explication: Elle fait une marche à chaque entier, le crayon doit se lever.
    revoir: cours
