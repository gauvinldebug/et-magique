# Exercices corrigés, du plus facile au type bac.
# type d'étape : init (vert), her (orange), conc (bleu), calcul, methode, piege (rouge)
exercices:
  - titre: Simplifier avec les règles
    difficulte: 1
    type: application
    enonce: |
      Écrire en fonction de $\ln 2$ et $\ln 3$.
      1. $A = \ln 18$
      2. $B = \ln\dfrac{8}{9}$
      3. $C = \ln\sqrt{6} + \ln\dfrac{1}{3}$
    indice: Décompose en produit de puissances de 2 et de 3.
    etapes:
      - type: calcul
        titre: Question 1
        texte: >-
          $18 = 2 \times 3^2$, donc $A = \ln 2 + 2\ln 3$.
      - type: calcul
        titre: Question 2
        texte: >-
          $B = \ln(2^3) - \ln(3^2) = 3\ln 2 - 2\ln 3$.
      - type: calcul
        titre: Question 3
        texte: >-
          $C = \frac{1}{2}\ln 6 - \ln 3 = \frac{1}{2}(\ln 2 + \ln 3) - \ln 3 = \frac{1}{2}\ln 2 - \frac{1}{2}\ln 3$.
        note: le produit devient une somme

  - titre: Résoudre des équations
    difficulte: 1
    type: methode
    enonce: |
      Résoudre dans $\mathbb{R}$.
      1. $\mathrm{e}^{2\corange{x} - 1} = 5$
      2. $\ln(2\corange{x} + 1) = 3$
    indice: Pour la question 2, commence par l'ensemble de résolution.
    etapes:
      - type: calcul
        titre: Question 1
        texte: >-
          $\mathrm{e}^{2\corange{x} - 1} = 5 \iff 2\corange{x} - 1 = \ln 5 \iff \corange{x} = \frac{1 + \ln 5}{2}$.
      - type: methode
        titre: Question 2, l'ensemble de résolution
        texte: Il faut $2\corange{x} + 1 > 0$, soit $\corange{x} > -\frac{1}{2}$.
      - type: calcul
        titre: Question 2, la résolution
        texte: >-
          $\ln(2\corange{x} + 1) = 3 \iff 2\corange{x} + 1 = \mathrm{e}^3 \iff \corange{x} = \frac{\mathrm{e}^3 - 1}{2} \approx 9{,}54$.
      - type: conc
        titre: Conclusion
        texte: Cette valeur est bien supérieure à $-\frac{1}{2}$, donc <mark>$S = \left\{\frac{\mathrm{e}^3 - 1}{2}\right\}$</mark>.

  - titre: Le piège de l'ensemble de résolution
    difficulte: 2
    type: piege
    enonce: |
      Résoudre $\ln(\corange{x}) + \ln(\corange{x} - 2) = \ln 3$.
    indice: Les deux logarithmes doivent exister en même temps.
    etapes:
      - type: methode
        titre: L'ensemble de résolution
        texte: Il faut $\corange{x} > 0$ et $\corange{x} - 2 > 0$, soit $\corange{x} > 2$.
      - type: calcul
        titre: On regroupe
        texte: >-
          $\ln(\corange{x}(\corange{x} - 2)) = \ln 3 \iff \corange{x}^2 - 2\corange{x} = 3 \iff \corange{x}^2 - 2\corange{x} - 3 = 0$. Les solutions sont $3$ et $-1$.
      - type: piege
        titre: On vérifie
        texte: $-1$ n'est pas dans l'ensemble de résolution, car $\ln(-1)$ n'existe pas.
        note: toujours vérifier
      - type: conc
        titre: Conclusion
        texte: <mark>$S = \{3\}$</mark>.

  - titre: À partir de quel rang ?
    difficulte: 2
    type: methode
    enonce: |
      Un médicament est éliminé à raison de 20 % par heure. La quantité restante au bout de $\corange{n}$ heures est $q_{\corange{n}} = 100 \times 0{,}8^{\corange{n}}$ (en mg).
      Au bout de combien d'heures reste-t-il moins de 5 mg ?
    indice: $\ln 0{,}8 < 0$. Attention au sens de l'inégalité quand tu divises.
    etapes:
      - type: calcul
        titre: On isole la puissance
        texte: $100 \times 0{,}8^{\corange{n}} < 5 \iff 0{,}8^{\corange{n}} < 0{,}05$.
      - type: calcul
        titre: On passe au logarithme
        texte: >-
          $\ln$ est strictement croissante, donc $0{,}8^{\corange{n}} < 0{,}05 \iff \corange{n}\ln 0{,}8 < \ln 0{,}05$.
      - type: piege
        titre: On divise par un nombre négatif
        texte: >-
          $\ln 0{,}8 < 0$ car $0{,}8 < 1$, donc le sens change : $\corange{n} > \dfrac{\ln 0{,}05}{\ln 0{,}8} \approx 13{,}4$.
        note: le sens change
      - type: conc
        titre: Conclusion
        texte: <mark>Il reste moins de 5 mg au bout de 14 heures</mark>.

  - titre: Une limite par croissances comparées
    difficulte: 2
    type: application
    enonce: |
      Déterminer $\lim\limits_{\corange{x} \to +\infty} (\corange{x} - \ln \corange{x})$ et $\lim\limits_{\corange{x} \to 0^+} (\corange{x}^2\ln \corange{x} + 1)$.
    indice: Pour la première, factorise par $\corange{x}$.
    etapes:
      - type: piege
        titre: Première limite, la forme indéterminée
        texte: >-
          $\corange{x} \to +\infty$ et $\ln \corange{x} \to +\infty$ : forme $\infty - \infty$.
      - type: calcul
        titre: On factorise par x
        texte: >-
          $\corange{x} - \ln \corange{x} = \corange{x}\left(1 - \dfrac{\ln \corange{x}}{\corange{x}}\right)$. Par croissances comparées, $\frac{\ln \corange{x}}{\corange{x}} \to 0$, donc la parenthèse tend vers 1 et la limite vaut <mark>$+\infty$</mark>.
      - type: calcul
        titre: Seconde limite
        texte: Par croissances comparées, $\corange{x}^2 \ln \corange{x} \to 0$ en $0^+$, donc la limite vaut <mark>$1$</mark>.

  - titre: Étude complète type bac
    difficulte: 3
    type: bac
    enonce: |
      Soit $\cbleu{f}$ définie sur $]0\,;+\infty[$ par $\cbleu{f}(\corange{x}) = \corange{x} - 2\ln \corange{x}$.
      1. Déterminer les limites de $\cbleu{f}$ en $0$ et en $+\infty$.
      2. Étudier les variations de $\cbleu{f}$ et donner son minimum.
      3. En déduire que pour tout $\corange{x} > 0$, $\ln \corange{x} < \frac{\corange{x}}{2}$.
    indice: >-
      $\cbleu{f}'(\corange{x}) = 1 - \frac{2}{\corange{x}} = \frac{\corange{x} - 2}{\corange{x}}$. Et $\ln 2 \approx 0{,}69$.
    etapes:
      - type: calcul
        titre: Question 1, en 0
        texte: >-
          $\corange{x} \to 0$ et $\ln \corange{x} \to -\infty$, donc $-2\ln \corange{x} \to +\infty$. Par somme, $\lim\limits_{0} \cbleu{f} = +\infty$.
      - type: calcul
        titre: Question 1, en +∞
        texte: >-
          Forme $\infty - \infty$. On écrit $\cbleu{f}(\corange{x}) = \corange{x}\left(1 - 2\frac{\ln \corange{x}}{\corange{x}}\right)$. La parenthèse tend vers 1 par croissances comparées, donc $\lim\limits_{+\infty} \cbleu{f} = +\infty$.
      - type: calcul
        titre: Question 2
        texte: >-
          $\cbleu{f}'(\corange{x}) = \frac{\corange{x} - 2}{\corange{x}}$, du signe de $\corange{x} - 2$ car $\corange{x} > 0$. $\cbleu{f}$ est décroissante sur $]0\,;2]$, croissante sur $[2\,;+\infty[$. Son minimum est $\cbleu{f}(2) = 2 - 2\ln 2 \approx 0{,}61$.
      - type: conc
        titre: Question 3
        texte: >-
          Le minimum est strictement positif, donc $\cbleu{f}(\corange{x}) > 0$ pour tout $\corange{x} > 0$, soit $\corange{x} > 2\ln \corange{x}$ : <mark>$\ln \corange{x} < \frac{\corange{x}}{2}$</mark>.
