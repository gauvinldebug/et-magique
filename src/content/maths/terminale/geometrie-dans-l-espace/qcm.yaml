questions:
  - question: Si $A(1\,;2\,;3)$ et $B(4\,;0\,;3)$, les coordonnées de $\overrightarrow{AB}$ sont…
    choix: ['$(3\,;-2\,;0)$', '$(5\,;2\,;6)$', '$(-3\,;2\,;0)$', '$(3\,;2\,;0)$']
    bonne: 0
    explication: On fait arrivée moins départ, $(4 - 1\,;0 - 2\,;3 - 3)$.
    revoir: cours

  - question: Que vaut $\vec{u} \cdot \vec{v}$ pour $\vec{u}(1\,;-2\,;3)$ et $\vec{v}(4\,;1\,;-1)$ ?
    choix: ['$-1$', '$0$', '$1$', '$9$']
    bonne: 0
    explication: $1 \times 4 + (-2) \times 1 + 3 \times (-1) = 4 - 2 - 3 = -1$.
    revoir: cours

  - question: Un vecteur normal au plan $3x - y + 2z - 7 = 0$ est…
    choix: ['$(3\,;-1\,;2)$', '$(3\,;-1\,;-7)$', '$(-1\,;2\,;-7)$', '$(1\,;3\,;0)$']
    bonne: 0
    explication: On lit les coefficients de $x$, $y$ et $z$.
    revoir: cours

  - question: Le point $M(3\,;1\,;5)$ est-il sur la droite $x = 1 + t$, $y = -1 + t$, $z = 2 + t$ ?
    choix: ['oui, avec $t = 2$', 'non', 'oui, avec $t = 3$', 'oui, avec $t = 1$']
    bonne: 1
    explication: >-
      La première ligne donne $t = 2$, la deuxième $t = 2$, mais la troisième donne $t = 3$. Il faut le même $t$ partout.
    revoir: exercices

  - question: Une droite de vecteur directeur $\vec{u}$ est parallèle au plan de vecteur normal $\vec{n}$ si…
    choix: ['$\vec{u}$ et $\vec{n}$ sont colinéaires', '$\vec{u} \cdot \vec{n} = 0$', '$\vec{u} = \vec{n}$', '$\vec{u} \cdot \vec{n} = 1$']
    bonne: 1
    explication: Le drone vole perpendiculairement au mât, donc parallèlement au sol.
    revoir: cours

  - question: Une équation du plan passant par $O$ et de vecteur normal $\vec{n}(1\,;1\,;1)$ est…
    choix: ['$x + y + z = 1$', '$x + y + z = 0$', '$x = y = z$', '$x + y + z = 3$']
    bonne: 1
    explication: >-
      $x + y + z + d = 0$, et $O(0\,;0\,;0)$ donne $d = 0$.
    revoir: cours

  - question: Deux droites de l'espace non parallèles sont…
    choix: ["toujours sécantes", "sécantes ou non coplanaires", "toujours orthogonales", "toujours confondues"]
    bonne: 1
    explication: Dans l'espace, deux droites peuvent se croiser « à des hauteurs différentes » sans jamais se toucher.
    revoir: cours

  - question: La norme de $\vec{u}(2\,;-1\,;2)$ vaut…
    choix: ['$3$', '$9$', '$\sqrt{5}$', '$5$']
    bonne: 0
    explication: $\sqrt{4 + 1 + 4} = \sqrt{9} = 3$.
    revoir: cours
