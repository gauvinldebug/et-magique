questions:
  - question: Les pertes par effet Joule valent…
    choix: ['$RI^2$', '$RI$', '$UI$', '$\frac{R}{I}$']
    bonne: 0
    explication: Elles sont proportionnelles au carré de l'intensité.
    revoir: cours

  - question: À puissance transportée égale, multiplier la tension par 10 divise les pertes par…
    choix: ['100', '10', '20', '1 000']
    bonne: 0
    explication: $P_J = \frac{RP^2}{U^2}$.
    revoir: cours

  - question: Dans le graphe d'un réseau électrique, les arcs représentent…
    choix: ['les lignes', 'les centrales', 'les villes', 'les tensions']
    bonne: 0
    explication: Les sommets sont les centrales, nœuds et villes.
    revoir: cours

  - question: En un nœud du réseau, la loi des nœuds dit que…
    choix: ["ce qui entre égale ce qui sort", "l'intensité double", "l'intensité est nulle", "les pertes sont nulles"]
    bonne: 0
    explication: Comme l'eau à un carrefour de tuyaux.
    revoir: cours

  - question: La fonction $f(x) = 5x^2 - 600x + 30\,000$ atteint son minimum en…
    choix: ['$x = 60$', '$x = 600$', '$x = 0$', '$x = 120$']
    bonne: 0
    explication: $\frac{-b}{2a} = \frac{600}{10} = 60$.
    revoir: exercices
