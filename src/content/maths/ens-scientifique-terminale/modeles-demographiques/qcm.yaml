questions:
  - question: Dans un modèle exponentiel, ce qui est constant est…
    choix: ['la variation relative', 'la variation absolue', 'la population', 'le temps']
    bonne: 0
    explication: On multiplie par le même nombre chaque année.
    revoir: cours

  - question: Une croissance de 3 % par an se traduit par une suite géométrique de raison…
    choix: ['$1{,}03$', '$0{,}03$', '$3$', '$1{,}3$']
    bonne: 0
    explication: Augmenter de 3 %, c'est multiplier par $1 + 0{,}03$.
    revoir: cours

  - question: À 1 % par an, une population double en environ…
    choix: ['70 ans', '100 ans', '50 ans', '10 ans']
    bonne: 0
    explication: $1{,}01^{70} \approx 2{,}01$.
    revoir: cours

  - question: Selon Malthus, les ressources croissent de façon…
    choix: ['arithmétique', 'géométrique', 'logistique', 'décroissante']
    bonne: 0
    explication: On ajoute une quantité fixe chaque année.
    revoir: cours

  - question: La courbe du modèle logistique de Verhulst a la forme…
    choix: ["d'un S qui se stabilise", "d'une droite", "d'une exponentielle sans limite", "d'une parabole"]
    bonne: 0
    explication: Croissance rapide, puis ralentissement vers la capacité d'accueil.
    revoir: cours
