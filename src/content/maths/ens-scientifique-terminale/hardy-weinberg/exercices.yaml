# Exercices corrigés, du plus facile au type bac.
# type d'étape : init (vert), her (orange), conc (bleu), calcul, methode, piege (rouge)
exercices:
  - titre: Des fréquences alléliques aux génotypes
    difficulte: 1
    type: application
    enonce: |
      Dans une population à l'équilibre, l'allèle A a une fréquence $p = 0{,}7$. Calculer les fréquences des trois génotypes.
    indice: $q = 1 - p$.
    etapes:
      - type: calcul
        titre: Les calculs
        texte: $q = 0{,}3$ ; $p^2 = 0{,}49$ ; $2pq = 0{,}42$ ; $q^2 = 0{,}09$.
      - type: conc
        titre: Conclusion
        texte: <mark>AA 49 %, Aa 42 %, aa 9 %</mark> (total 100 %).

  - titre: Retrouver p et q
    difficulte: 2
    type: methode
    enonce: |
      Dans une population à l'équilibre, 16 % des individus ont le génotype aa. Calculer $q$, $p$, puis la fréquence des hétérozygotes.
    indice: $q^2 = 0{,}16$.
    etapes:
      - type: calcul
        titre: q et p
        texte: $q = \sqrt{0{,}16} = 0{,}4$ et $p = 0{,}6$.
      - type: calcul
        titre: Les hétérozygotes
        texte: $2pq = 2 \times 0{,}6 \times 0{,}4 = 0{,}48$.
      - type: conc
        titre: Conclusion
        texte: <mark>48 % d'hétérozygotes</mark>.

  - titre: Pourquoi 2pq
    difficulte: 2
    type: piege
    enonce: |
      Avec $p = q = 0{,}5$, un élève calcule $P(\text{Aa}) = pq = 0{,}25$. Les trois génotypes totalisent alors $0{,}25 + 0{,}25 + 0{,}25 = 0{,}75$. Trouver l'erreur.
    indice: Dessine l'arbre des deux tirages.
    etapes:
      - type: piege
        titre: L'erreur
        texte: Deux branches mènent à Aa (A puis a, et a puis A). Il faut les additionner.
      - type: calcul
        titre: La correction
        texte: $P(\text{Aa}) = pq + qp = 2pq = 0{,}5$, et $0{,}25 + 0{,}5 + 0{,}25 = 1$.
      - type: conc
        titre: Conclusion
        texte: <mark>$P(\text{Aa}) = 2pq = 0{,}5$</mark>.

  - titre: Atteindre l'équilibre
    difficulte: 3
    type: bac
    enonce: |
      Une population fondatrice ne contient que des individus AA (50 %) et aa (50 %). Les unions se font ensuite au hasard.
      1. Calculer les fréquences alléliques $p$ et $q$.
      2. Calculer les fréquences des génotypes à la génération suivante.
      3. Montrer qu'elles ne changent plus ensuite.
      4. Dans une population réelle, on observe 60 % de AA, 10 % de Aa et 30 % de aa. Est-elle à l'équilibre ?
    indice: Chaque AA apporte deux allèles A, chaque Aa un seul.
    etapes:
      - type: calcul
        titre: Question 1
        texte: $p = 0{,}5$ et $q = 0{,}5$.
      - type: calcul
        titre: Question 2
        texte: AA $0{,}25$ ; Aa $0{,}5$ ; aa $0{,}25$.
      - type: calcul
        titre: Question 3
        texte: $p' = 0{,}25 + \frac{1}{2} \times 0{,}5 = 0{,}5 = p$ ; les fréquences des génotypes restent $0{,}25$, $0{,}5$, $0{,}25$.
      - type: methode
        titre: Question 4
        texte: >-
          $p = 0{,}6 + \frac{0{,}1}{2} = 0{,}65$ et $q = 0{,}35$. À l'équilibre, on attendrait $2pq \approx 0{,}455$ d'hétérozygotes, très loin des 10 % observés.
      - type: conc
        titre: Conclusion
        texte: >-
          <mark>L'équilibre est atteint dès la deuxième génération ; la population réelle n'y est pas</mark>, signe d'unions non aléatoires ou de sélection.
