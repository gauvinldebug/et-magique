questions:
  - question: La fonction exponentielle est l'unique fonction telle que…
    choix: ["$\\cbleu{f}' = \\cbleu{f}$ et $\\cbleu{f}(0) = 1$", "$\\cbleu{f}' = \\cbleu{f}$ et $\\cbleu{f}(0) = 0$", "$\\cbleu{f}' = 1$ et $\\cbleu{f}(0) = 1$", "$\\cbleu{f}(1) = 0$"]
    bonne: 0
    explication: C'est la pâte qui gonfle à une vitesse égale à sa taille, avec une taille 1 au départ.
    revoir: cours

  - question: $\mathrm{e}^{3} \times \mathrm{e}^{-5}$ est égal à…
    choix: ['$\mathrm{e}^{-15}$', '$\mathrm{e}^{-2}$', '$\mathrm{e}^{8}$', '$-\mathrm{e}^{2}$']
    bonne: 1
    explication: $\mathrm{e}^{a}\mathrm{e}^{b} = \mathrm{e}^{a + b}$, et $3 - 5 = -2$.
    revoir: cours

  - question: $\dfrac{\mathrm{e}^{2\corange{x}}}{\mathrm{e}^{\corange{x}}}$ est égal à…
    choix: ['$2$', '$\mathrm{e}^{2}$', '$\mathrm{e}^{\corange{x}}$', '$\mathrm{e}^{3\corange{x}}$']
    bonne: 2
    explication: $\mathrm{e}^{2\corange{x} - \corange{x}} = \mathrm{e}^{\corange{x}}$.
    revoir: cours

  - question: La dérivée de $\mathrm{e}^{-3\corange{x}}$ est…
    choix: ['$\mathrm{e}^{-3\corange{x}}$', '$-3\mathrm{e}^{-3\corange{x}}$', '$3\mathrm{e}^{-3\corange{x}}$', '$-3\corange{x}\mathrm{e}^{-3\corange{x}}$']
    bonne: 1
    explication: $(\mathrm{e}^{k\corange{x}})' = k\mathrm{e}^{k\corange{x}}$ avec $k = -3$.
    revoir: cours

  - question: L'équation $\mathrm{e}^{\corange{x}} = -1$ a…
    choix: ["une solution, $\\corange{x} = 0$", "une solution, $\\corange{x} = -1$", "aucune solution", "deux solutions"]
    bonne: 2
    explication: L'exponentielle est toujours strictement positive.
    revoir: cours

  - question: L'équation $\mathrm{e}^{3\corange{x} + 1} = \mathrm{e}^{\corange{x} + 5}$ a pour solution…
    choix: ['$\corange{x} = 2$', '$\corange{x} = 3$', '$\corange{x} = \frac{1}{2}$', '$\corange{x} = 4$']
    bonne: 0
    explication: On égale les exposants, $3\corange{x} + 1 = \corange{x} + 5$, donc $\corange{x} = 2$.
    revoir: exercices

  - question: La fonction $\corange{x} \mapsto \mathrm{e}^{-0{,}5\corange{x}}$ est…
    choix: ["croissante sur $\\mathbb{R}$", "décroissante sur $\\mathbb{R}$", "négative sur $\\mathbb{R}$", "constante"]
    bonne: 1
    explication: Sa dérivée $-0{,}5\,\mathrm{e}^{-0{,}5\corange{x}}$ est négative.
    revoir: cours

  - question: La suite $u_{\corange{n}} = \mathrm{e}^{2\corange{n}}$ est…
    choix: ["arithmétique de raison 2", "géométrique de raison $\\mathrm{e}^2$", "géométrique de raison 2", "constante"]
    bonne: 1
    explication: $u_{\corange{n}+1} = \mathrm{e}^{2\corange{n} + 2} = \mathrm{e}^{2} \times u_{\corange{n}}$.
    revoir: cours
