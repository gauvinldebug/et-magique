# Exercices corrigés, du plus facile au type contrôle.
# type d'étape : init (vert), her (orange), conc (bleu), calcul, methode, piege (rouge)
exercices:
  - titre: Avec les coordonnées
    difficulte: 1
    type: application
    enonce: |
      Dans un repère orthonormé, $A(1\,;2)$, $B(4\,;3)$ et $C(2\,;5)$.
      1. Calculer $\overrightarrow{AB} \cdot \overrightarrow{AC}$.
      2. Le triangle $ABC$ est-il rectangle en $A$ ?
    indice: Calcule d'abord les coordonnées des vecteurs.
    etapes:
      - type: calcul
        titre: Les vecteurs
        texte: $\overrightarrow{AB}(3\,;1)$ et $\overrightarrow{AC}(1\,;3)$.
      - type: calcul
        titre: Question 1
        texte: $\overrightarrow{AB} \cdot \overrightarrow{AC} = 3 \times 1 + 1 \times 3 = 6$.
      - type: conc
        titre: Question 2
        texte: Le produit scalaire n'est pas nul, donc <mark>le triangle n'est pas rectangle en $A$</mark>.

  - titre: Calculer un angle
    difficulte: 2
    type: methode
    enonce: |
      On reprend $\overrightarrow{AB}(3\,;1)$ et $\overrightarrow{AC}(1\,;3)$. Calculer une valeur approchée de l'angle $\widehat{BAC}$.
    indice: Utilise les deux formules du produit scalaire, coordonnées et cosinus.
    etapes:
      - type: calcul
        titre: Les normes
        texte: $AB = \sqrt{9 + 1} = \sqrt{10}$ et $AC = \sqrt{1 + 9} = \sqrt{10}$.
      - type: calcul
        titre: Le cosinus
        texte: $6 = \sqrt{10} \times \sqrt{10} \times \cos \widehat{BAC}$, donc $\cos \widehat{BAC} = \frac{6}{10} = 0{,}6$.
        note: deux formules, un même nombre
      - type: conc
        titre: Conclusion
        texte: <mark>$\widehat{BAC} \approx 53{,}1°$</mark>.

  - titre: Avec une projection
    difficulte: 2
    type: methode
    enonce: |
      $ABCD$ est un carré de côté 4, et $I$ est le milieu de $[BC]$. Calculer $\overrightarrow{AB} \cdot \overrightarrow{AI}$ et $\overrightarrow{AB} \cdot \overrightarrow{AD}$.
    indice: Projette $I$ sur la droite $(AB)$.
    etapes:
      - type: methode
        titre: L'ombre de I
        texte: Le projeté orthogonal de $I$ sur $(AB)$ est $B$, car $(IB) \perp (AB)$.
        note: la lampe éclaire à la verticale
      - type: calcul
        titre: Premier produit
        texte: $\overrightarrow{AB} \cdot \overrightarrow{AI} = \overrightarrow{AB} \cdot \overrightarrow{AB} = AB^2 = 16$.
      - type: conc
        titre: Second produit
        texte: >-
          $\overrightarrow{AD} \perp \overrightarrow{AB}$, donc <mark>$\overrightarrow{AB} \cdot \overrightarrow{AD} = 0$</mark> : $\overrightarrow{AD}$ n'a pas d'ombre sur $(AB)$.

  - titre: Al-Kashi
    difficulte: 2
    type: application
    enonce: |
      Dans un triangle $ABC$, $AB = 7$, $AC = 5$ et $BC = 8$. Calculer l'angle $\hat{A}$.
    indice: $\cos \hat{A} = \frac{b^2 + c^2 - a^2}{2bc}$ avec $a = BC$.
    etapes:
      - type: calcul
        titre: La formule
        texte: $\cos \hat{A} = \frac{5^2 + 7^2 - 8^2}{2 \times 5 \times 7} = \frac{25 + 49 - 64}{70} = \frac{10}{70} = \frac{1}{7}$.
      - type: conc
        titre: Conclusion
        texte: <mark>$\hat{A} \approx 81{,}8°$</mark>.

  - titre: Équation d'une droite
    difficulte: 2
    type: methode
    enonce: |
      Déterminer une équation de la droite $d$ passant par $A(2\,;-1)$ et perpendiculaire à la droite $(BC)$, avec $B(0\,;3)$ et $C(4\,;1)$.
    indice: $\overrightarrow{BC}$ est un vecteur normal à $d$.
    etapes:
      - type: calcul
        titre: Le vecteur normal
        texte: >-
          $\overrightarrow{BC}(4\,;-2)$ est normal à $d$, donc $d : 4x - 2y + c = 0$.
      - type: calcul
        titre: On trouve c
        texte: $A \in d$, donc $8 + 2 + c = 0$ et $c = -10$.
      - type: conc
        titre: Conclusion
        texte: >-
          <mark>$d : 4x - 2y - 10 = 0$</mark>, ou en simplifiant par 2, $2x - y - 5 = 0$.

  - titre: Cercle de diamètre donné
    difficulte: 3
    type: bac
    enonce: |
      Soit $A(-1\,;2)$ et $B(3\,;4)$.
      1. Déterminer une équation du cercle $\mathcal{C}$ de diamètre $[AB]$ en utilisant $\overrightarrow{MA} \cdot \overrightarrow{MB} = 0$.
      2. En déduire son centre et son rayon.
      3. Le point $E(0\,;5)$ est-il sur $\mathcal{C}$ ?
    indice: Avec $M(x\,;y)$, développe le produit scalaire, puis fais apparaître des carrés.
    etapes:
      - type: calcul
        titre: Question 1
        texte: >-
          $\overrightarrow{MA}(-1 - x\,;2 - y)$, $\overrightarrow{MB}(3 - x\,;4 - y)$. Le produit vaut $(-1 - x)(3 - x) + (2 - y)(4 - y) = x^2 - 2x - 3 + y^2 - 6y + 8$. Donc $\mathcal{C} : x^2 + y^2 - 2x - 6y + 5 = 0$.
      - type: calcul
        titre: Question 2
        texte: >-
          $(x - 1)^2 - 1 + (y - 3)^2 - 9 + 5 = 0 \iff (x - 1)^2 + (y - 3)^2 = 5$. Centre $(1\,;3)$, le milieu de $[AB]$, et rayon $\sqrt{5}$.
        note: on retrouve le milieu
      - type: conc
        titre: Question 3
        texte: $(0 - 1)^2 + (5 - 3)^2 = 1 + 4 = 5$, donc <mark>$E$ est sur le cercle</mark>.
