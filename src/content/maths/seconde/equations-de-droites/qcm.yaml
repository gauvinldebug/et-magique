questions:
  - question: Le coefficient directeur de la droite passant par $A(0\,;1)$ et $B(2\,;7)$ est…
    choix: ['$3$', '$\frac{1}{3}$', '$6$', '$4$']
    bonne: 0
    explication: $\frac{7 - 1}{2 - 0} = 3$.
    revoir: cours

  - question: La droite $y = -2x + 5$ coupe l'axe des ordonnées au point…
    choix: ['$(0\,;5)$', '$(5\,;0)$', '$(0\,;-2)$', '$(2{,}5\,;0)$']
    bonne: 0
    explication: >-
      Pour $x = 0$, $y = 5$ : c'est l'ordonnée à l'origine.
    revoir: cours

  - question: Une équation de la droite verticale passant par $(3\,;8)$ est…
    choix: ['$x = 3$', '$y = 3$', '$y = 8$', '$y = 3x + 8$']
    bonne: 0
    explication: Tous ses points ont pour abscisse 3.
    revoir: exercices

  - question: Un vecteur directeur de la droite $2x - y + 4 = 0$ est…
    choix: ['$\begin{pmatrix} 1 \\ 2 \end{pmatrix}$', '$\begin{pmatrix} 2 \\ -1 \end{pmatrix}$', '$\begin{pmatrix} 2 \\ 1 \end{pmatrix}$', '$\begin{pmatrix} -1 \\ 4 \end{pmatrix}$']
    bonne: 0
    explication: Avec $a = 2$ et $b = -1$, $\begin{pmatrix} -b \\ a \end{pmatrix} = \begin{pmatrix} 1 \\ 2 \end{pmatrix}$.
    revoir: cours

  - question: Les droites $y = 3x - 1$ et $y = 3x + 7$ sont…
    choix: ['parallèles', 'sécantes', 'confondues', 'perpendiculaires']
    bonne: 0
    explication: Même pente 3, ordonnées à l'origine différentes.
    revoir: cours

  - question: La solution du système $\begin{cases} x + y = 10 \\ x - y = 4 \end{cases}$ est…
    choix: ['$(7\,;3)$', '$(3\,;7)$', '$(6\,;4)$', '$(5\,;5)$']
    bonne: 0
    explication: En additionnant, $2x = 14$, donc $x = 7$ et $y = 3$.
    revoir: exercices
