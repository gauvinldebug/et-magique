questions:
  - question: $\vec{AB} + \vec{BC}$ est égal à…
    choix: ['$\vec{AC}$', '$\vec{CA}$', '$\vec{BB}$', '$\vec{AB}$']
    bonne: 0
    explication: Relation de Chasles, deux glissades à la suite.
    revoir: cours

  - question: Si $A(3\,;-1)$ et $B(1\,;4)$, alors $\vec{AB}$ a pour coordonnées…
    choix: ['$\begin{pmatrix} -2 \\ 5 \end{pmatrix}$', '$\begin{pmatrix} 2 \\ -5 \end{pmatrix}$', '$\begin{pmatrix} 4 \\ 3 \end{pmatrix}$', '$\begin{pmatrix} -2 \\ 3 \end{pmatrix}$']
    bonne: 0
    explication: Arrivée moins départ, $1 - 3 = -2$ et $4 - (-1) = 5$.
    revoir: cours

  - question: $ABCD$ est un parallélogramme si et seulement si…
    choix: ['$\vec{AB} = \vec{DC}$', '$\vec{AB} = \vec{CD}$', '$\vec{AC} = \vec{BD}$', '$AB = CD$']
    bonne: 0
    explication: On fait le tour dans l'ordre, $\vec{AB}$ et $\vec{DC}$ vont dans le même sens.
    revoir: cours

  - question: Les vecteurs $\vec{u}\begin{pmatrix} 2 \\ -3 \end{pmatrix}$ et $\vec{v}\begin{pmatrix} -4 \\ 6 \end{pmatrix}$ sont…
    choix: ['colinéaires', 'non colinéaires', 'égaux', 'orthogonaux']
    bonne: 0
    explication: $\vec{v} = -2\vec{u}$, et $\det = 2 \times 6 - (-4)(-3) = 0$.
    revoir: cours

  - question: Le milieu de $[AB]$ avec $A(-1\,;6)$ et $B(5\,;2)$ est…
    choix: ['$(2\,;4)$', '$(3\,;2)$', '$(6\,;-4)$', '$(4\,;8)$']
    bonne: 0
    explication: On fait la moyenne des abscisses et des ordonnées.
    revoir: exercices

  - question: La longueur du vecteur $\vec{u}\begin{pmatrix} 5 \\ 12 \end{pmatrix}$ dans un repère orthonormé est…
    choix: ['$13$', '$17$', '$\sqrt{17}$', '$169$']
    bonne: 0
    explication: $\sqrt{25 + 144} = \sqrt{169} = 13$.
    revoir: cours
