questions:
  - question: Une baisse de 15 % correspond au coefficient multiplicateur…
    choix: ['$0{,}85$', '$1{,}15$', '$0{,}15$', '$-0{,}15$']
    bonne: 0
    explication: $1 - 0{,}15 = 0{,}85$.
    revoir: cours

  - question: Un prix augmente de 10 % puis de 10 %. Il a augmenté au total de…
    choix: ['$21\,\%$', '$20\,\%$', '$11\,\%$', '$100\,\%$']
    bonne: 0
    explication: $1{,}1 \times 1{,}1 = 1{,}21$, soit $+21\,\%$.
    revoir: cours

  - question: Après une hausse de 50 %, un objet coûte 60 €. Son prix initial était…
    choix: ['$40$ €', '$30$ €', '$90$ €', '$45$ €']
    bonne: 0
    explication: $\frac{60}{1{,}5} = 40$.
    revoir: exercices

  - question: Pour compenser une baisse de 50 %, il faut une hausse de…
    choix: ['$100\,\%$', '$50\,\%$', '$150\,\%$', '$200\,\%$']
    bonne: 0
    explication: $\frac{1}{0{,}5} = 2$, donc il faut doubler, soit $+100\,\%$.
    revoir: cours

  - question: Une population passe de 800 à 600. Le taux d'évolution est…
    choix: ['$-25\,\%$', '$-33{,}3\,\%$', '$-200\,\%$', '$+25\,\%$']
    bonne: 0
    explication: $\frac{600 - 800}{800} = -0{,}25$. On divise par la valeur de départ.
    revoir: cours

  - question: 20 % des 60 % d'une population représentent…
    choix: ['$12\,\%$ de la population', '$80\,\%$ de la population', '$40\,\%$ de la population', '$3\,\%$ de la population']
    bonne: 0
    explication: $0{,}2 \times 0{,}6 = 0{,}12$.
    revoir: cours
