# Exercices corrigés, du plus facile au type contrôle.
# type d'étape : init (vert), her (orange), conc (bleu), calcul, methode, piege (rouge)
exercices:
  - titre: Comparer avec la bonne silhouette
    difficulte: 1
    type: application
    enonce: |
      Comparer sans calculatrice, en justifiant.
      1. $1{,}8^2$ et $1{,}9^2$
      2. $(-4)^2$ et $(-3)^2$
      3. $\frac{1}{5}$ et $\frac{1}{7}$
      4. $\sqrt{10}$ et $\sqrt{11}$
    indice: Repère d'abord le signe des nombres.
    etapes:
      - type: calcul
        titre: Question 1
        texte: >-
          Positifs et carré croissant sur $[0\,;+\infty[$ : $1{,}8^2 < 1{,}9^2$.
      - type: piege
        titre: Question 2
        texte: >-
          Négatifs : le carré est **décroissant** sur $]-\infty\,;0]$. $-4 < -3$ donc $(-4)^2 > (-3)^2$.
        note: le bol descend d'abord
      - type: calcul
        titre: Question 3
        texte: >-
          Positifs et inverse décroissante sur $]0\,;+\infty[$ : $5 < 7$ donc $\frac{1}{5} > \frac{1}{7}$.
      - type: conc
        titre: Question 4
        texte: <mark>La racine est croissante, donc $\sqrt{10} < \sqrt{11}$</mark>.

  - titre: Signe d'une fonction affine
    difficulte: 1
    type: methode
    enonce: |
      Dresser le tableau de signes de $\cbleu{f}(\corange{x}) = -3\corange{x} + 12$.
    indice: Cherche où elle s'annule, puis regarde le signe de $m$.
    etapes:
      - type: calcul
        titre: Le zéro
        texte: $-3\corange{x} + 12 = 0 \iff \corange{x} = 4$.
      - type: conc
        titre: Le signe
        texte: >-
          $m = -3 < 0$ : <mark>$\cbleu{f}$ est positive sur $]-\infty\,;4[$ et négative sur $]4\,;+\infty[$</mark>.
        note: la rampe descend

  - titre: Encadrer un carré
    difficulte: 2
    type: piege
    enonce: |
      On sait que $-3 \le \corange{x} \le 2$. Encadrer $\corange{x}^2$.
    indice: L'intervalle contient 0, le bas du bol.
    etapes:
      - type: piege
        titre: L'erreur à éviter
        texte: >-
          Élever chaque borne au carré donnerait $9 \le \corange{x}^2 \le 4$, ce qui est absurde.
      - type: calcul
        titre: Le raisonnement
        texte: >-
          Le minimum du carré est 0, atteint en 0, qui est dans l'intervalle. Le maximum est atteint à la borne la plus éloignée de 0 : $(-3)^2 = 9$.
      - type: conc
        titre: Conclusion
        texte: <mark>$0 \le \corange{x}^2 \le 9$</mark>.

  - titre: Résoudre avec les silhouettes
    difficulte: 2
    type: application
    enonce: |
      Résoudre dans $\mathbb{R}$.
      1. $\corange{x}^2 < 16$
      2. $\dfrac{1}{\corange{x}} \ge 2$
      3. $\sqrt{\corange{x}} = 3$
    indice: Dessine chaque courbe et la droite horizontale.
    etapes:
      - type: calcul
        titre: Question 1
        texte: Le bol est sous la droite $y = 16$ entre $-4$ et 4. $S = \,]-4\,;4[$.
      - type: calcul
        titre: Question 2
        texte: >-
          Seule la branche positive peut dépasser 2. Sur $]0\,;+\infty[$, $\frac{1}{\corange{x}} \ge 2 \iff \corange{x} \le \frac{1}{2}$. $S = \,]0\,;\tfrac{1}{2}]$.
        note: 0 est exclu
      - type: conc
        titre: Question 3
        texte: <mark>$\corange{x} = 9$</mark>.

  - titre: Carré, racine, ou le nombre lui-même
    difficulte: 3
    type: methode
    enonce: |
      1. Pour $\corange{x} \ge 0$, factoriser $\corange{x}^2 - \corange{x}$.
      2. En déduire le signe de $\corange{x}^2 - \corange{x}$ selon que $\corange{x} \in [0\,;1]$ ou $\corange{x} \ge 1$.
      3. Ranger $0{,}7$, $0{,}7^2$ et $\sqrt{0{,}7}$ dans l'ordre croissant.
    indice: $\corange{x}(\corange{x} - 1)$ et un tableau de signes.
    etapes:
      - type: calcul
        titre: Question 1
        texte: $\corange{x}^2 - \corange{x} = \corange{x}(\corange{x} - 1)$.
      - type: calcul
        titre: Question 2
        texte: >-
          Sur $[0\,;1]$, $\corange{x} \ge 0$ et $\corange{x} - 1 \le 0$ donc le produit est négatif : $\corange{x}^2 \le \corange{x}$. Sur $[1\,;+\infty[$, positif : $\corange{x}^2 \ge \corange{x}$.
      - type: conc
        titre: Question 3
        texte: >-
          $0{,}7 \in [0\,;1]$ : <mark>$0{,}7^2 < 0{,}7 < \sqrt{0{,}7}$</mark>. Vérification, $0{,}49 < 0{,}7 < 0{,}836\dots$
