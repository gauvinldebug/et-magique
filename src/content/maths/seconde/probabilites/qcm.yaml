questions:
  - question: On lance un dé équilibré. La probabilité d'obtenir un multiple de 3 est…
    choix: ['$\frac{1}{3}$', '$\frac{1}{2}$', '$\frac{1}{6}$', '$\frac{2}{3}$']
    bonne: 0
    explication: Deux issues favorables, 3 et 6, sur six.
    revoir: cours

  - question: Si $P(A) = 0{,}3$, alors $P(\bar{A})$ vaut…
    choix: ['$0{,}7$', '$0{,}3$', '$-0{,}3$', '$1{,}3$']
    bonne: 0
    explication: $P(\bar{A}) = 1 - P(A)$.
    revoir: cours

  - question: $P(A) = 0{,}5$, $P(B) = 0{,}4$, $P(A \cap B) = 0{,}2$. Alors $P(A \cup B)$ vaut…
    choix: ['$0{,}7$', '$0{,}9$', '$0{,}2$', '$1{,}1$']
    bonne: 0
    explication: $0{,}5 + 0{,}4 - 0{,}2 = 0{,}7$.
    revoir: cours

  - question: Deux événements incompatibles…
    choix: ['ne peuvent pas se réaliser en même temps', 'sont forcément contraires', 'ont la même probabilité', 'ont une probabilité nulle']
    bonne: 0
    explication: $A \cap B = \varnothing$. Contraires, c'est plus fort, il faut en plus que l'un ou l'autre se réalise toujours.
    revoir: cours

  - question: Pour un échantillon de taille $n = 100$ et $p = 0{,}5$, l'intervalle de fluctuation à 95 % est…
    choix: ['$[0{,}4\,;0{,}6]$', '$[0{,}45\,;0{,}55]$', '$[0\,;1]$', '$[0{,}49\,;0{,}51]$']
    bonne: 0
    explication: $\frac{1}{\sqrt{100}} = 0{,}1$.
    revoir: exercices

  - question: Si on prend un échantillon plus grand, les fréquences observées…
    choix: ['fluctuent moins autour de $p$', 'fluctuent plus', 'sont toujours égales à $p$', 'ne changent pas']
    bonne: 0
    explication: Une plus grosse cuillère donne un goût plus fidèle, même si ce n'est jamais exact.
    revoir: cours
