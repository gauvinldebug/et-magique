# Exercices corrigés, du plus facile au type contrôle.
# type d'étape : init (vert), her (orange), conc (bleu), calcul, methode, piege (rouge)
exercices:
  - titre: Le dé
    difficulte: 1
    type: application
    enonce: |
      On lance un dé équilibré à 6 faces.
      1. Quelle est la probabilité d'obtenir 4 ?
      2. Quelle est la probabilité d'obtenir un nombre impair ?
      3. Quelle est la probabilité d'obtenir 7 ?
    indice: Compte les faces favorables.
    etapes:
      - type: calcul
        titre: Question 1
        texte: Une face sur six, $P = \frac{1}{6}$.
      - type: calcul
        titre: Question 2
        texte: >-
          1, 3, 5 : $P = \frac{3}{6} = \frac{1}{2}$.
      - type: conc
        titre: Question 3
        texte: <mark>C'est impossible, $P = 0$</mark>.

  - titre: Le contraire
    difficulte: 1
    type: methode
    enonce: |
      La probabilité qu'il pleuve demain est de 0,35. Quelle est la probabilité qu'il ne pleuve pas ?
    indice: Les deux probabilités se complètent pour faire 1.
    etapes:
      - type: conc
        titre: Le calcul
        texte: <mark>$P = 1 - 0{,}35 = 0{,}65$</mark>, soit 65 %.

  - titre: La roue
    difficulte: 2
    type: application
    enonce: |
      Une roue est partagée en 10 secteurs identiques numérotés de 1 à 10. On la fait tourner.
      1. Quelle est la probabilité d'obtenir un multiple de 3 ?
      2. Quelle est la probabilité d'obtenir un nombre supérieur ou égal à 8 ?
      3. Quelle est la probabilité de ne pas obtenir un multiple de 3 ?
    indice: Les multiples de 3 jusqu'à 10 sont 3, 6 et 9.
    etapes:
      - type: calcul
        titre: Question 1
        texte: >-
          3, 6 et 9 : $P = \frac{3}{10}$.
      - type: calcul
        titre: Question 2
        texte: >-
          8, 9 et 10 : $P = \frac{3}{10}$.
      - type: conc
        titre: Question 3
        texte: <mark>$P = 1 - \frac{3}{10} = \frac{7}{10}$</mark>.

  - titre: La pièce qui « doit » tomber sur face
    difficulte: 3
    type: piege
    enonce: |
      Nina a lancé une pièce équilibrée 5 fois, elle a obtenu 5 fois pile. Elle dit : « Au prochain lancer, face a forcément plus de chances. »
      1. A-t-elle raison ?
      2. Après 1 000 lancers, que peut-on attendre pour la fréquence de pile ?
    indice: La pièce ne se souvient pas des lancers précédents.
    etapes:
      - type: piege
        titre: Question 1
        texte: >-
          Non. Chaque lancer est indépendant : la probabilité de face reste $\frac{1}{2}$.
        note: pas de mémoire
      - type: conc
        titre: Question 2
        texte: <mark>La fréquence de pile sera proche de 0,5</mark>, même si elle ne sera pas exactement 0,5.
