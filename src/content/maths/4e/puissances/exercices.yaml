# Exercices corrigés, du plus facile au type contrôle.
# type d'étape : init (vert), her (orange), conc (bleu), calcul, methode, piege (rouge)
exercices:
  - titre: Calculer des puissances
    difficulte: 1
    type: application
    enonce: |
      Calculer sans calculatrice.
      1. $3^4$
      2. $(-2)^3$
      3. $-5^2$
      4. $10^{-2}$
    indice: Écris les produits en entier.
    etapes:
      - type: calcul
        titre: Questions 1 et 2
        texte: $3^4 = 3 \times 3 \times 3 \times 3 = 81$. $(-2)^3 = -8$ (trois facteurs négatifs).
      - type: piege
        titre: Question 3
        texte: >-
          Sans parenthèses, seul le 5 est au carré : $-5^2 = -25$.
        note: attention aux parenthèses
      - type: conc
        titre: Question 4
        texte: <mark>$10^{-2} = \frac{1}{100} = 0{,}01$</mark>.

  - titre: Règles des puissances de 10
    difficulte: 1
    type: methode
    enonce: |
      Écrire sous la forme $10^n$.
      1. $A = 10^5 \times 10^{-2}$
      2. $B = \dfrac{10^3}{10^7}$
      3. $C = \dfrac{10^4 \times 10^{-6}}{10^{-5}}$
    indice: On ajoute les exposants pour un produit, on les soustrait pour un quotient.
    etapes:
      - type: calcul
        titre: Questions 1 et 2
        texte: $A = 10^{5 - 2} = 10^3$. $B = 10^{3 - 7} = 10^{-4}$.
      - type: conc
        titre: Question 3
        texte: <mark>$C = \frac{10^{-2}}{10^{-5}} = 10^{-2 - (-5)} = 10^3$</mark>.
        note: moins par moins

  - titre: Notation scientifique
    difficulte: 2
    type: application
    enonce: |
      Écrire en notation scientifique.
      1. $52\,000\,000$
      2. $0{,}000\,38$
      3. $47 \times 10^{-5}$
    indice: Le nombre devant doit être entre 1 et 10.
    etapes:
      - type: calcul
        titre: Question 1
        texte: $5{,}2 \times 10^7$ (la virgule recule de 7 rangs).
      - type: calcul
        titre: Question 2
        texte: $3{,}8 \times 10^{-4}$.
      - type: conc
        titre: Question 3
        texte: <mark>$47 \times 10^{-5} = 4{,}7 \times 10^1 \times 10^{-5} = 4{,}7 \times 10^{-4}$</mark>.

  - titre: La vitesse de la lumière
    difficulte: 3
    type: methode
    enonce: |
      La lumière parcourt $3 \times 10^5$ km par seconde. La distance moyenne entre le Soleil et la Terre est $1{,}5 \times 10^8$ km.
      Combien de temps la lumière du Soleil met-elle pour nous parvenir ? Donner le résultat en secondes, puis en minutes.
    indice: Temps = distance divisée par vitesse.
    etapes:
      - type: calcul
        titre: En secondes
        texte: $\frac{1{,}5 \times 10^8}{3 \times 10^5} = 0{,}5 \times 10^3 = 500$ s.
      - type: conc
        titre: En minutes
        texte: >-
          $500 \div 60 \approx 8{,}3$. <mark>La lumière du Soleil met environ 8 minutes et 20 secondes à nous parvenir</mark>.
