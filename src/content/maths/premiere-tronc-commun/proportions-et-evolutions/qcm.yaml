  - question: Une baisse de 50 % suivie d'une hausse de 50 % donne…
    choix: ['une baisse de 25 %', 'le prix de départ', 'une hausse de 25 %', 'une baisse de 50 %']
    bonne: 0
    explication: $0{,}5 \times 1{,}5 = 0{,}75$.
