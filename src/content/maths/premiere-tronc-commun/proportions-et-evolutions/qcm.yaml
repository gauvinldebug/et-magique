  - question: Un prix passe de 50 € à 40 €. Le taux d'évolution est…
    choix: ['$-20\,\%$', '$-25\,\%$', '$-10\,\%$', '$+20\,\%$']
    bonne: 0
    explication: $\frac{40 - 50}{50} = -0{,}2$.
    revoir: exercices

  - question: Un indice de 85 (base 100) signifie…
    choix: ['une baisse de 15 %', 'une hausse de 85 %', 'une baisse de 85 %', 'une hausse de 15 %']
    bonne: 0
    explication: $\frac{85}{100} = 0{,}85 = 1 - 0{,}15$.
    revoir: cours

