questions:
  - question: $20\,\%$ de 150, c'est…
    choix: ['$30$', '$120$', '$180$', '$20$']
    bonne: 0
    explication: $150 \times 0{,}2 = 30$.
    revoir: cours

  - question: Baisser un prix de 10 %, c'est le multiplier par…
    choix: ['$0{,}9$', '$0{,}1$', '$1{,}1$', '$-10$']
    bonne: 0
    explication: $1 - \frac{10}{100} = 0{,}9$.
    revoir: cours

  - question: $\frac{1}{2} + \frac{1}{3} = \ldots$
    choix: ['$\frac{5}{6}$', '$\frac{2}{5}$', '$\frac{1}{5}$', '$\frac{2}{6}$']
    bonne: 0
    explication: $\frac{3}{6} + \frac{2}{6} = \frac{5}{6}$.
    revoir: exercices

  - question: $10^3 \times 10^{-5} = \ldots$
    choix: ['$10^{-2}$', '$10^{-15}$', '$10^{8}$', '$10^{2}$']
    bonne: 0
    explication: >-
      On additionne les exposants : $3 - 5 = -2$.
    revoir: cours

  - question: La solution de $5x - 4 = 11$ est…
    choix: ['$3$', '$\frac{7}{5}$', '$15$', '$-3$']
    bonne: 0
    explication: $5x = 15$, donc $x = 3$.
    revoir: cours
