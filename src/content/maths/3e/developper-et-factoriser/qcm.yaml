questions:
  - question: $(\corange{x} + 5)^2$ est égal à…
    choix: ['$\corange{x}^2 + 10\corange{x} + 25$', '$\corange{x}^2 + 25$', '$\corange{x}^2 + 5\corange{x} + 25$', '$2\corange{x} + 10$']
    bonne: 0
    explication: Le double produit vaut $2 \times \corange{x} \times 5 = 10\corange{x}$.
    revoir: cours

  - question: La forme factorisée de $6\corange{x} - 18$ est…
    choix: ['$6(\corange{x} - 3)$', '$6(\corange{x} - 18)$', '$3(2\corange{x} - 3)$', '$6\corange{x}(1 - 3)$']
    bonne: 0
    explication: $6 \times \corange{x} - 6 \times 3$, le facteur commun est 6.
    revoir: cours

  - question: $\corange{x}^2 - 81$ se factorise en…
    choix: ['$(\corange{x} - 9)(\corange{x} + 9)$', '$(\corange{x} - 9)^2$', '$(\corange{x} - 81)(\corange{x} + 1)$', 'on ne peut pas']
    bonne: 0
    explication: $a^2 - b^2 = (a - b)(a + b)$ avec $b = 9$.
    revoir: cours

  - question: Les solutions de $(\corange{x} - 4)(2\corange{x} + 6) = 0$ sont…
    choix: ['$4$ et $-3$', '$-4$ et $3$', '$4$ et $-6$', '$4$ et $3$']
    bonne: 0
    explication: $\corange{x} - 4 = 0$ donne 4, et $2\corange{x} + 6 = 0$ donne $-3$.
    revoir: cours

  - question: $-(3\corange{x} - 2)$ est égal à…
    choix: ['$-3\corange{x} + 2$', '$-3\corange{x} - 2$', '$3\corange{x} + 2$', '$3\corange{x} - 2$']
    bonne: 0
    explication: Le moins change tous les signes dans la parenthèse.
    revoir: exercices
