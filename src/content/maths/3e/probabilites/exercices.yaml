# Exercices corrigés, du plus facile au type brevet.
# type d'étape : init (vert), her (orange), conc (bleu), calcul, methode, piege (rouge)
exercices:
  - titre: Le sac de jetons
    difficulte: 1
    type: application
    enonce: |
      Un sac contient 12 jetons numérotés de 1 à 12. On en tire un au hasard.
      1. Quelle est la probabilité d'obtenir un nombre pair ?
      2. Quelle est la probabilité d'obtenir un multiple de 5 ?
      3. Quelle est la probabilité de ne pas obtenir un multiple de 5 ?
    indice: Liste les issues favorables.
    etapes:
      - type: calcul
        titre: Question 1
        texte: >-
          2, 4, 6, 8, 10, 12 : six issues. $P = \frac{6}{12} = \frac{1}{2}$.
      - type: calcul
        titre: Question 2
        texte: 5 et 10. $P = \frac{2}{12} = \frac{1}{6}$.
      - type: conc
        titre: Question 3
        texte: <mark>$P = 1 - \frac{1}{6} = \frac{5}{6}$</mark>.

  - titre: Une roue pas équilibrée
    difficulte: 2
    type: piege
    enonce: |
      Une roue a trois secteurs : rouge (la moitié de la roue), bleu (un quart) et vert (le reste).
      Léa dit : « Il y a 3 couleurs, donc la probabilité d'obtenir vert est $\frac{1}{3}$. » A-t-elle raison ?
    indice: Les trois secteurs n'ont pas la même taille.
    etapes:
      - type: piege
        titre: L'erreur
        texte: >-
          Les trois issues ne sont pas équiprobables : on ne peut pas compter « 1 sur 3 ».
      - type: calcul
        titre: Le calcul
        texte: Vert occupe $1 - \frac{1}{2} - \frac{1}{4} = \frac{1}{4}$ de la roue.
      - type: conc
        titre: Conclusion
        texte: <mark>Non, $P(\text{vert}) = \frac{1}{4}$</mark>.

  - titre: Deux tirages sans remise
    difficulte: 2
    type: methode
    enonce: |
      Une urne contient 3 boules rouges et 2 boules noires. On tire une boule, on ne la remet pas, puis on en tire une deuxième.
      Quelle est la probabilité d'obtenir deux boules rouges ?
    indice: Au deuxième tirage, il ne reste que 4 boules.
    etapes:
      - type: calcul
        titre: Premier tirage
        texte: $P(R_1) = \frac{3}{5}$.
      - type: calcul
        titre: Deuxième tirage
        texte: >-
          Il reste 2 rouges sur 4 boules, donc la branche suivante vaut $\frac{2}{4} = \frac{1}{2}$.
        note: sans remise
      - type: conc
        titre: Le chemin
        texte: <mark>$P(R_1 \text{ et } R_2) = \frac{3}{5} \times \frac{1}{2} = \frac{3}{10}$</mark>.

  - titre: Le jeu de dés
    difficulte: 3
    type: brevet
    enonce: |
      On lance deux dés équilibrés à 6 faces et on additionne les résultats.
      1. Combien y a-t-il d'issues possibles (en distinguant les deux dés) ?
      2. Quelle est la probabilité d'obtenir une somme égale à 7 ?
      3. Tom dit que la somme 12 est aussi probable que la somme 7. A-t-il raison ?
    indice: Fais un tableau à double entrée, 6 lignes et 6 colonnes.
    etapes:
      - type: calcul
        titre: Question 1
        texte: $6 \times 6 = 36$ issues équiprobables.
      - type: calcul
        titre: Question 2
        texte: >-
          Somme 7 : (1,6), (2,5), (3,4), (4,3), (5,2), (6,1). $P = \frac{6}{36} = \frac{1}{6}$.
      - type: conc
        titre: Question 3
        texte: >-
          Somme 12 : seulement (6,6), donc $P = \frac{1}{36}$. <mark>Tom a tort, 7 est six fois plus probable que 12</mark>.
