exercices:
- titre: Calculer des images
  difficulte: 1
  type: application
  enonce: |
    $g(x) = 3x - 7$. Calculer $g(2)$, $g(0)$ et $g(-1)$.
  indice: Remplace $x$.
  etapes:
  - type: calcul
    titre: Les deux premières
    texte: $g(2) = -1$ ; $g(0) = -7$.
  - type: conc
    titre: La dernière
    texte: <mark>$g(-1) = -10$.</mark>
- titre: Un antécédent
  difficulte: 2
  type: methode
  enonce: |
    $g(x) = 3x - 7$. Trouver l'antécédent de 11.
  indice: Résous $g(x) = 11$.
  etapes:
  - type: calcul
    titre: Équation
    texte: $3x - 7 = 11$, donc $3x = 18$.
  - type: conc
    titre: Réponse
    texte: '<mark>$x = 6$ : l''antécédent de 11 est 6.</mark>'
- titre: L'image et les antécédents
  difficulte: 2
  type: piege
  enonce: |
    Avec $f(x) = x^2$, un élève dit : « L'antécédent de 16 est 4. » Que manque-t-il ?
  indice: $(-4)^2$ vaut combien ?
  etapes:
  - type: piege
    titre: L'erreur
    texte: Il oublie un antécédent.
  - type: conc
    titre: Correction
    texte: '<mark>16 a deux antécédents : 4 et $-4$.</mark>'
- titre: Lecture graphique
  difficulte: 2
  type: methode
  enonce: |
    Une courbe passe par $(0\,;2)$, $(1\,;3)$, $(3\,;3)$ et $(5\,;0)$. Donner l'image de 1 et les antécédents de 3 parmi ces points.
  indice: Abscisse puis ordonnée.
  etapes:
  - type: calcul
    titre: Image
    texte: 'Le point $(1\,;3)$ : l''image de 1 est 3.'
  - type: conc
    titre: Antécédents
    texte: '<mark>Les points d''ordonnée 3 sont $(1\,;3)$ et $(3\,;3)$ : 1 et 3 sont des antécédents de 3.</mark>'
