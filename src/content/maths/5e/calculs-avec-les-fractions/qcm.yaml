    choix: ['$\frac{2}{3}$', '$\frac{2}{6}$', '$\frac{1}{6}$', '$\frac{1}{9}$']
    bonne: 0
    explication: Même dénominateur, on additionne les numérateurs et on garde le 3.
    revoir: cours

  - question: Quelle fraction est égale à $\frac{3}{4}$ ?
    choix: ['$\frac{9}{12}$', '$\frac{6}{7}$', '$\frac{4}{3}$', '$\frac{3}{8}$']
    bonne: 0
    explication: On multiplie en haut et en bas par 3.
    revoir: cours

  - question: La plus grande fraction est…
    choix: ['$\frac{5}{6}$', '$\frac{2}{3}$', '$\frac{1}{2}$', '$\frac{3}{4}$']
    bonne: 0
    explication: En douzièmes, $\frac{10}{12}$, $\frac{8}{12}$, $\frac{6}{12}$, $\frac{9}{12}$.
