  - question: $\frac{2}{5}$ de 35 est égal à…
    choix: ['$14$', '$7$', '$70$', '$17{,}5$']
    bonne: 0
    explication: $35 \div 5 = 7$, puis $7 \times 2 = 14$.
    revoir: cours

  - question: $\frac{1}{2} - \frac{1}{6}$ est égal à…
    choix: ['$\frac{1}{3}$', '$\frac{0}{4}$', '$\frac{1}{4}$', '$\frac{2}{3}$']
    bonne: 0
    explication: $\frac{3}{6} - \frac{1}{6} = \frac{2}{6} = \frac{1}{3}$.
    revoir: exercices
