  revoir: cours
- question: Un cercle de rayon 3 cm a un diamètre de…
  choix:
  - 1,5 cm
  - 3 cm
  - 6 cm
  - 9 cm
  bonne: 2
  explication: Diamètre = 2 × rayon.
  revoir: cours
- question: Deux droites parallèles à une même droite sont…
  choix:
  - parallèles entre elles
  - perpendiculaires
  - sécantes
  - on ne peut pas savoir
