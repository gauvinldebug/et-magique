  revoir: cours
- question: Une corde est un segment qui relie…
  choix:
  - le centre à un point du cercle
  - deux points du cercle
  - deux centres
  - un point extérieur au centre
  bonne: 1
  explication: Le diamètre est une corde particulière.
  revoir: cours
- question: $AB = 4$ signifie que…
  choix:
  - A et B sont sur une droite
  - le segment [AB] mesure 4
  - AB est une droite
  - A vaut 4
  bonne: 1
