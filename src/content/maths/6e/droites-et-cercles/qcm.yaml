questions:
- question: $[AB)$ désigne…
  choix:
  - un segment
  - une demi-droite d'origine A
  - une droite
  - une longueur
  bonne: 1
  explication: Elle part de A et passe par B.
  revoir: cours
- question: Deux droites qui ne se coupent jamais sont…
  choix:
  - sécantes
  - perpendiculaires
  - parallèles
  - confondues
