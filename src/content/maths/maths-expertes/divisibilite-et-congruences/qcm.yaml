questions:
  - question: Le reste de la division euclidienne de 47 par 5 est…
    choix: ['$2$', '$9$', '$7$', '$-3$']
    bonne: 0
    explication: $47 = 5 \times 9 + 2$.
    revoir: cours

  - question: $38 \equiv \ldots\ [7]$
    choix: ['$3$', '$5$', '$38$ seulement', '$4$']
    bonne: 0
    explication: $38 = 7 \times 5 + 3$.
    revoir: cours

  - question: Si $a \equiv 2\ [5]$, alors $a^2 \equiv \ldots\ [5]$
    choix: ['$4$', '$2$', '$1$', '$0$']
    bonne: 0
    explication: On peut remplacer $a$ par son reste, $2^2 = 4$.
    revoir: cours

  - question: Le chiffre des unités de $3^{4}$ est…
    choix: ['$1$', '$3$', '$9$', '$7$']
    bonne: 0
    explication: $3^4 = 81$.
    revoir: exercices

  - question: Si $d$ divise $a$ et $b$, alors $d$ divise…
    choix: ['$2a - 3b$', '$\frac{a}{b}$', '$a + 1$', '$ab + 1$']
    bonne: 0
    explication: Un diviseur commun divise toute combinaison $ua + vb$.
    revoir: cours
