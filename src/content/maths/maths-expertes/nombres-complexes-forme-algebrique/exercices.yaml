# Exercices corrigés, du plus facile au type bac.
# type d'étape : init (vert), her (orange), conc (bleu), calcul, methode, piege (rouge)
exercices:
  - titre: Calculs en forme algébrique
    difficulte: 1
    type: application
    enonce: |
      Écrire sous forme algébrique.
      1. $z_1 = (3 - 2i) + (-1 + 5i)$
      2. $z_2 = (1 + 2i)(3 - i)$
      3. $z_3 = (2 + 3i)^2$
    indice: Remplace $i^2$ par $-1$.
    etapes:
      - type: calcul
        titre: Questions 1 et 2
        texte: $z_1 = 2 + 3i$. $z_2 = 3 - i + 6i - 2i^2 = 5 + 5i$.
      - type: piege
        titre: Question 3
        texte: >-
          $z_3 = 4 + 12i + 9i^2 = 4 + 12i - 9$. Le carré de $3i$ vaut $-9$.
        note: i² = -1
      - type: conc
        titre: Conclusion
        texte: <mark>$z_3 = -5 + 12i$</mark>.

  - titre: Un quotient
    difficulte: 1
    type: methode
    enonce: |
      Écrire $z = \dfrac{5}{2 + i}$ puis $w = \dfrac{1 + i}{1 - i}$ sous forme algébrique.
    indice: Multiplie par le conjugué du dénominateur.
    etapes:
      - type: calcul
        titre: Le premier
        texte: $z = \frac{5(2 - i)}{(2 + i)(2 - i)} = \frac{5(2 - i)}{5} = 2 - i$.
      - type: conc
        titre: Le second
        texte: >-
          $w = \frac{(1 + i)^2}{2} = \frac{1 + 2i - 1}{2}$, <mark>$w = i$</mark>.
        note: un quart de tour

  - titre: Équations
    difficulte: 2
    type: application
    enonce: |
      Résoudre dans $\mathbb{C}$.
      1. $2z + i = 3 - z$
      2. $z^2 + 2z + 5 = 0$
    indice: Pour la 2, calcule $\Delta$.
    etapes:
      - type: calcul
        titre: Question 1
        texte: $3z = 3 - i$, donc $z = 1 - \frac{1}{3}i$.
      - type: calcul
        titre: Question 2, le discriminant
        texte: $\Delta = 4 - 20 = -16 < 0$, et $\sqrt{16} = 4$.
      - type: conc
        titre: Question 2, les solutions
        texte: <mark>$z = \frac{-2 \pm 4i}{2}$, soit $-1 - 2i$ et $-1 + 2i$</mark>.

  - titre: Réel ou imaginaire pur
    difficulte: 3
    type: bac
    enonce: |
      Pour $z = x + iy$ ($x$, $y$ réels), on pose $Z = z^2 + \bar{z}$.
      1. Exprimer $\text{Re}(Z)$ et $\text{Im}(Z)$ en fonction de $x$ et $y$.
      2. Déterminer les $z$ pour lesquels $Z$ est réel.
    indice: Développe $z^2 = (x + iy)^2$.
    etapes:
      - type: calcul
        titre: Question 1
        texte: >-
          $Z = x^2 - y^2 + 2ixy + x - iy$. Donc $\text{Re}(Z) = x^2 - y^2 + x$ et $\text{Im}(Z) = 2xy - y = y(2x - 1)$.
      - type: calcul
        titre: Question 2
        texte: >-
          $Z$ réel $\iff y(2x - 1) = 0 \iff y = 0$ ou $x = \frac{1}{2}$.
      - type: conc
        titre: Conclusion
        texte: <mark>$Z$ est réel quand $z$ est réel, ou quand $\text{Re}(z) = \frac{1}{2}$</mark>.
