exercices:
- titre: Construire un ABR
  difficulte: 1
  type: application
  enonce: |
    Insérer dans cet ordre, dans un ABR vide : 8, 3, 10, 1, 6, 14, 4. Dessiner l'arbre obtenu.
  indice: Chaque valeur descend à gauche si elle est plus petite, à droite sinon.
  etapes:
  - type: calcul
    titre: Les insertions
    texte: '8 racine. 3 à gauche de 8. 10 à droite de 8. 1 à gauche de 3. 6 à droite de 3. 14 à droite de 10. 4 : < 8, > 3, < 6, donc à gauche de 6.'
  - type: conc
    titre: L'arbre
    texte: <mark>Racine 8 ; à gauche 3 (fils 1 et 6, et 4 à gauche de 6) ; à droite 10 (fils droit 14).</mark>
- titre: Le parcours infixe
  difficulte: 2
  type: methode
  enonce: |
    Donner le parcours infixe de l'arbre de l'exercice précédent. Que remarque-t-on ?
  indice: Gauche, racine, droit.
  etapes:
  - type: calcul
    titre: Le parcours
    texte: 1, 3, 4, 6, 8, 10, 14.
  - type: conc
    titre: La remarque
    texte: '<mark>Les valeurs sortent dans l''ordre croissant</mark> : c''est toujours le cas pour un ABR.'
- titre: Le faux ABR
  difficulte: 2
  type: piege
  enonce: |
    L'arbre de racine 10, de fils gauche 5 et droit 15, où 5 a un fils droit 12, est-il un ABR ? Chaque nœud est pourtant bien placé par rapport à son parent.
  indice: Regarder 12 par rapport à la racine.
  etapes:
  - type: piege
    titre: L'erreur
    texte: 12 est à droite de 5 (12 > 5, correct localement), mais il est dans le sous-arbre gauche de 10, alors que 12 > 10.
  - type: conc
    titre: La réponse
    texte: '<mark>Ce n''est pas un ABR</mark> : la propriété doit être vraie pour tout le sous-arbre gauche de 10.'
- titre: Le minimum
  difficulte: 3
  type: bac
  enonce: |
    Écrire une fonction `minimum(a)` qui renvoie la plus petite valeur d'un ABR non vide. Quel est son coût ?
  indice: Où se trouve la plus petite valeur ?
  etapes:
  - type: methode
    titre: L'idée
    texte: 'Les plus petites valeurs sont toujours à gauche : on descend à gauche tant que c''est possible.'
  - type: calcul
    titre: La fonction
    texte: "```python\ndef minimum(a):\n    while a.gauche is not None:\n        a = a.gauche\n    return a.valeur\n```"
  - type: conc
    titre: Le coût
    texte: '<mark>Au plus la hauteur de l''arbre</mark> : environ $\log_2 n$ s''il est équilibré, $n$ s''il est filiforme.'
