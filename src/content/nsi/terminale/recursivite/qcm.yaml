- question: Que renvoie `factorielle(4)` ?
  choix:
  - '4'
  - '10'
  - '24'
  - '16'
  bonne: 2
  explication: 4 × 3 × 2 × 1 = 24.
  revoir: cours
- question: Une RecursionError signale…
