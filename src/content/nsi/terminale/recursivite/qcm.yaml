- question: La puissance rapide calcule $x^{1024}$ en environ…
  choix:
  - 1 024 appels
  - 512 appels
  - 11 appels
  - 2 appels
  bonne: 2
  explication: 'On divise n par 2 à chaque fois : 1024 = 2¹⁰.'
  revoir: cours
