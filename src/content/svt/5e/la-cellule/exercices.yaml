exercices:
- titre: Le grossissement
  difficulte: 1
  type: application
  enonce: |
    On observe avec un oculaire × 10 et un objectif × 10, puis × 40. Calculer les deux grossissements.
  indice: Multiplier oculaire et objectif.
  etapes:
  - type: conc
    titre: Les calculs
    texte: <mark>× 100, puis × 400</mark>.
- titre: Animale ou végétale ?
  difficulte: 2
  type: methode
  enonce: |
    Au microscope, on voit des cellules rectangulaires, avec un contour épais et de petits grains verts. Est-ce une cellule animale ou végétale ? Justifier.
  indice: Paroi et chloroplastes.
  etapes:
  - type: calcul
    titre: Les indices
    texte: Le contour épais est une paroi ; les grains verts sont des chloroplastes.
  - type: conc
    titre: La réponse
    texte: <mark>Cellule végétale</mark>, venant d'une partie verte de la plante.
- titre: La racine verte
  difficulte: 2
  type: piege
  enonce: |
    « Toutes les cellules d'une plante ont des chloroplastes. » Corriger.
  indice: Une racine est-elle verte ?
  etapes:
  - type: piege
    titre: L'erreur
    texte: Seules les parties vertes contiennent des chloroplastes.
  - type: conc
    titre: La correction
    texte: '<mark>Les cellules de racine n''ont pas de chloroplastes</mark>, mais elles ont une paroi : ce sont bien des cellules végétales.'
- titre: Taille réelle
  difficulte: 3
  type: brevet
  enonce: |
    Au grossissement × 400, une cellule de joue paraît mesurer 24 mm.
    Calculer sa taille réelle en mm, puis en µm (1 mm = 1 000 µm).
  indice: Taille réelle = taille observée / grossissement.
  etapes:
  - type: calcul
    titre: En mm
    texte: $24 / 400 = 0{,}06$ mm.
  - type: conc
    titre: En µm
    texte: <mark>$0{,}06 \times 1\,000 = 60$ µm</mark>.
