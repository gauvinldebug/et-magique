    bonne: 1
    explication: Une charge négative en plus.
    revoir: cours

  - question: Avec la soude, les ions cuivre $\mathrm{Cu^{2+}}$ donnent un précipité…
    choix: ['vert', 'rouille', 'bleu', 'blanc']
