questions:
  - question: L'énergie cinétique d'un objet dépend…
    choix: ['de sa masse seulement', 'de sa vitesse seulement', 'de sa masse et de sa vitesse', 'de sa couleur']
    bonne: 2
    explication: $E_c = \frac{1}{2}mv^2$.
    revoir: cours

  - question: 72 km/h correspondent à…
    choix: ['20 m/s', '259 m/s', '7,2 m/s', '36 m/s']
    bonne: 0
    explication: $72/3{,}6 = 20$.
    revoir: cours

  - question: Si la vitesse est multipliée par 3, l'énergie cinétique est multipliée par…
    choix: ['3', '6', '9', '1,5']
    bonne: 2
    explication: $3^2 = 9$.
    revoir: exercices

  - question: La distance d'arrêt est la somme…
    choix: ['de la distance de réaction et de la distance de freinage', 'de deux distances de freinage', 'de la vitesse et du temps', "de l'énergie et de la masse"]
    bonne: 0
    explication: $d_A = d_R + d_F$.
    revoir: cours

  - question: Quand un objet tombe, son énergie de position…
    choix: ['augmente', 'se convertit en énergie cinétique', 'disparaît', 'reste constante']
    bonne: 1
    explication: Il va de plus en plus vite.
    revoir: cours
