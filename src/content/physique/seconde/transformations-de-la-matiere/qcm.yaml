    revoir: cours

  - question: Une transformation chimique conserve…
    choix: ['les molécules', 'les éléments chimiques', 'les noyaux et les molécules', 'rien']
    bonne: 1
    explication: Les atomes se réarrangent, ils ne changent pas.
    revoir: cours

  - question: Dans une réaction nucléaire, on conserve…
    choix: ['les éléments', 'le nombre de nucléons et la charge', 'la masse des molécules', 'le nombre de neutrons']
    bonne: 1
