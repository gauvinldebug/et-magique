exercices:
  - titre: Le gaz parfait
    difficulte: 1
    type: application
    enonce: |
      Un pneu contient $V = 30$ L d'air à la pression $P = 2{,}5 \times 10^5$ Pa et à 20 °C. Calculer la quantité d'air qu'il contient. $R = 8{,}314\ \mathrm{J \cdot mol^{-1} \cdot K^{-1}}$.
    indice: $n = \dfrac{PV}{RT}$, avec $V$ en $\mathrm{m^3}$ et $T$ en K.
    etapes:
      - type: piege
        titre: Les unités
        texte: $V = 30 \times 10^{-3} = 3{,}0 \times 10^{-2}\ \mathrm{m^3}$ et $T = 20 + 273 = 293$ K.
      - type: conc
        titre: Le calcul
        texte: <mark>$n = \dfrac{2{,}5 \times 10^5 \times 3{,}0 \times 10^{-2}}{8{,}314 \times 293} \approx 3{,}1$ mol</mark>.

  - titre: Chauffer de l'eau
    difficulte: 1
    type: methode
    enonce: |
      Quelle énergie faut-il fournir pour faire passer 1,5 L d'eau de 20 °C à 100 °C ? Avec une bouilloire de 2 000 W et sans pertes, combien de temps faut-il ? $c_{\text{eau}} = 4{,}18 \times 10^3\ \mathrm{J \cdot kg^{-1} \cdot K^{-1}}$.
    indice: 1,5 L d'eau = 1,5 kg. Puis $\Delta t = Q / P$.
    etapes:
      - type: calcul
        titre: L'énergie
        texte: $Q = m\,c\,\Delta T = 1{,}5 \times 4{,}18 \times 10^3 \times 80 \approx 5{,}0 \times 10^5$ J.
      - type: conc
        titre: La durée
        texte: <mark>$\Delta t = \dfrac{5{,}0 \times 10^5}{2\,000} \approx 250$ s, un peu plus de 4 min</mark>.

  - titre: Le signe des échanges
    difficulte: 2
    type: piege
    enonce: |
      On comprime rapidement l'air d'une pompe à vélo : on fournit un travail de 50 J et, pendant ce temps, l'air cède 10 J à la paroi par transfert thermique.
      Un élève écrit $\Delta U = 50 + 10 = 60$ J. Corriger.
    indice: Le compte en banque. Qu'est-ce qui entre, qu'est-ce qui sort ?
    etapes:
      - type: methode
        titre: Les conventions
        texte: Le système (l'air) reçoit le travail, $W = +50$ J. Il cède de l'énergie thermique, $Q = -10$ J.
      - type: piege
        titre: L'erreur
        texte: Additionner les valeurs absolues revient à compter un retrait comme un dépôt.
      - type: conc
        titre: Résultat
        texte: <mark>$\Delta U = 50 - 10 = 40$ J</mark>. L'énergie interne augmente, l'air s'échauffe.

  - titre: Isoler un mur
    difficulte: 2
    type: methode
    enonce: |
      Un mur de $S = 10\ \mathrm{m^2}$ a une résistance thermique $R_1 = 0{,}020\ \mathrm{K \cdot W^{-1}}$. L'intérieur est à 19 °C, l'extérieur à 4 °C.
      1. Calculer le flux thermique à travers le mur.
      2. On ajoute un isolant de résistance $R_2 = 0{,}10\ \mathrm{K \cdot W^{-1}}$. Calculer le nouveau flux.
    indice: Les résistances en série s'ajoutent.
    etapes:
      - type: calcul
        titre: Sans isolant
        texte: $\Phi = \dfrac{19 - 4}{0{,}020} = 750$ W.
      - type: calcul
        titre: Avec isolant
        texte: $R = R_1 + R_2 = 0{,}12\ \mathrm{K \cdot W^{-1}}$, donc $\Phi' = \dfrac{15}{0{,}12} = 125$ W.
      - type: conc
        titre: Conclusion
        texte: <mark>Les pertes sont divisées par 6</mark>.

  - titre: Le refroidissement d'un café
    difficulte: 3
    type: bac
    enonce: |
      Un café à $T_0 = 80$ °C est posé dans une pièce à $T_{\text{ext}} = 20$ °C. On admet la loi de Newton, avec $\tau = 15$ min.
      1. Écrire l'expression de $T(t)$.
      2. Quelle est sa température au bout de 15 min ? de 30 min ?
      3. Au bout de combien de temps atteint-il 40 °C ?
    indice: $T(t) = T_{\text{ext}} + (T_0 - T_{\text{ext}})\,\mathrm{e}^{-t/\tau}$.
    etapes:
      - type: calcul
        titre: L'expression
        texte: $T(t) = 20 + 60\,\mathrm{e}^{-t/15}$ (T en °C, t en min).
      - type: calcul
        titre: À 15 et 30 min
        texte: $T(15) = 20 + 60\,\mathrm{e}^{-1} \approx 42$ °C ; $T(30) = 20 + 60\,\mathrm{e}^{-2} \approx 28$ °C.
        note: vite au début, lentement ensuite
      - type: calcul
        titre: 40 °C
        texte: $60\,\mathrm{e}^{-t/15} = 20 \iff \mathrm{e}^{-t/15} = \frac{1}{3} \iff t = 15\ln 3$.
      - type: conc
        titre: Résultat
        texte: <mark>$t \approx 16$ min</mark>.
