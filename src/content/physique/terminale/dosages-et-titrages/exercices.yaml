exercices:
  - titre: Lire une droite d'étalonnage
    difficulte: 1
    type: application
    enonce: |
      Des solutions de diiode de concentrations connues ont été passées au spectrophotomètre. La droite d'étalonnage a pour équation $A = 1{,}5 \times 10^{3} \times c$, avec $c$ en $\mathrm{mol \cdot L^{-1}}$.
      Une solution inconnue a une absorbance de 0,60. Calculer sa concentration.
    indice: Le nuancier se lit à l'envers. $c = A/k$.
    etapes:
      - type: methode
        titre: La loi
        texte: La droite passe par l'origine, c'est la loi de Beer-Lambert $A = k\,c$ avec $k = 1{,}5 \times 10^3\ \mathrm{L \cdot mol^{-1}}$.
      - type: conc
        titre: Le calcul
        texte: <mark>$c = \dfrac{A}{k} = \dfrac{0{,}60}{1{,}5 \times 10^3} = 4{,}0 \times 10^{-4}\ \mathrm{mol \cdot L^{-1}}$</mark>.

  - titre: Relation à l'équivalence
    difficulte: 1
    type: methode
    enonce: |
      On titre $V_A = 20{,}0\ \mathrm{mL}$ d'acide chlorhydrique par une solution de soude de concentration $c_B = 1{,}0 \times 10^{-1}\ \mathrm{mol \cdot L^{-1}}$. L'équivalence est obtenue pour $V_E = 12{,}4\ \mathrm{mL}$.
      Écrire la réaction support et calculer la concentration $c_A$ de l'acide.
    indice: Un $\mathrm{H_3O^+}$ pour un $\mathrm{HO^-}$.
    etapes:
      - type: calcul
        titre: La réaction support
        texte: $\mathrm{H_3O^+} + \mathrm{HO^-} \longrightarrow 2\,\mathrm{H_2O}$, coefficients 1 et 1.
      - type: methode
        titre: L'équivalence
        texte: Tous les invités sont assis, $n(\mathrm{H_3O^+})_{\text{initial}} = n(\mathrm{HO^-})_{\text{versé à l'équivalence}}$, soit $c_A V_A = c_B V_E$.
      - type: conc
        titre: Le résultat
        texte: <mark>$c_A = \dfrac{c_B V_E}{V_A} = \dfrac{0{,}10 \times 12{,}4}{20{,}0} = 6{,}2 \times 10^{-2}\ \mathrm{mol \cdot L^{-1}}$</mark>.
        note: les mL se simplifient

  - titre: Des coefficients différents de 1
    difficulte: 2
    type: piege
    enonce: |
      On titre $V_1 = 10{,}0\ \mathrm{mL}$ d'une solution d'ions fer(II) $\mathrm{Fe^{2+}}$ par des ions permanganate $\mathrm{MnO_4^-}$ de concentration $c_2 = 2{,}0 \times 10^{-2}\ \mathrm{mol \cdot L^{-1}}$. Réaction support :
      $$\mathrm{MnO_4^-} + 5\,\mathrm{Fe^{2+}} + 8\,\mathrm{H^+} \longrightarrow \mathrm{Mn^{2+}} + 5\,\mathrm{Fe^{3+}} + 4\,\mathrm{H_2O}$$
      L'équivalence est repérée par la persistance de la teinte violette pour $V_E = 9{,}6\ \mathrm{mL}$. Calculer $c_1$.
    indice: Chaque chaise accueille ici 5 invités.
    etapes:
      - type: piege
        titre: Le piège
        texte: Écrire $c_1 V_1 = c_2 V_E$ est faux, car il faut 5 ions fer(II) pour un ion permanganate.
      - type: methode
        titre: La bonne relation
        texte: |
          $$\frac{n(\mathrm{Fe^{2+}})}{5} = \frac{n(\mathrm{MnO_4^-})_E}{1} \quad\Longrightarrow\quad c_1 V_1 = 5\,c_2 V_E$$
      - type: conc
        titre: Le calcul
        texte: <mark>$c_1 = \dfrac{5 \times 2{,}0 \times 10^{-2} \times 9{,}6}{10{,}0} \approx 9{,}6 \times 10^{-2}\ \mathrm{mol \cdot L^{-1}}$</mark>.

  - titre: Expliquer une courbe de conductimétrie
    difficulte: 2
    type: methode
    enonce: |
      On titre une solution d'acide chlorhydrique ($\mathrm{H_3O^+} + \mathrm{Cl^-}$) par une solution de soude ($\mathrm{Na^+} + \mathrm{HO^-}$). La conductivité diminue jusqu'à $V_E$, puis augmente.
      Données : $\lambda(\mathrm{H_3O^+}) = 35{,}0$, $\lambda(\mathrm{HO^-}) = 19{,}8$, $\lambda(\mathrm{Na^+}) = 5{,}0$, $\lambda(\mathrm{Cl^-}) = 7{,}6$ (en $\mathrm{mS \cdot m^2 \cdot mol^{-1}}$). Justifier l'allure de la courbe.
    indice: Fais l'inventaire des ions qui apparaissent et disparaissent, avant puis après l'équivalence.
    etapes:
      - type: calcul
        titre: Avant l'équivalence
        texte: Chaque $\mathrm{HO^-}$ versé consomme un $\mathrm{H_3O^+}$ et apporte un $\mathrm{Na^+}$. On remplace un ion de $\lambda = 35{,}0$ par un ion de $\lambda = 5{,}0$, donc $\sigma$ diminue.
      - type: calcul
        titre: Après l'équivalence
        texte: Il n'y a plus de $\mathrm{H_3O^+}$. Les $\mathrm{Na^+}$ et $\mathrm{HO^-}$ versés s'accumulent, donc $\sigma$ augmente.
      - type: conc
        titre: Conclusion
        texte: <mark>Le minimum de conductivité, à la rupture de pente, correspond à l'équivalence</mark>. Les ions $\mathrm{Cl^-}$ sont spectateurs, leur quantité ne change pas.

  - titre: Titrer le vinaigre
    difficulte: 3
    type: bac
    enonce: |
      On dilue 10 fois un vinaigre. On titre $V_A = 10{,}0\ \mathrm{mL}$ de la solution diluée par de la soude à $c_B = 1{,}00 \times 10^{-1}\ \mathrm{mol \cdot L^{-1}}$. Le suivi pH-métrique donne $V_E = 10{,}2\ \mathrm{mL}$ et un pH de 4,8 pour $V = 5{,}1\ \mathrm{mL}$.
      1. Écrire la réaction support (acide éthanoïque $\mathrm{CH_3COOH}$).
      2. Calculer la concentration du vinaigre.
      3. Que représente la valeur 4,8 ?
      4. En déduire le degré d'acidité, c'est-à-dire la masse d'acide (en g) dans 100 g de vinaigre. Données : $M(\mathrm{CH_3COOH}) = 60{,}0\ \mathrm{g \cdot mol^{-1}}$, masse volumique du vinaigre $1{,}01\ \mathrm{g \cdot mL^{-1}}$.
    indice: Ne pas oublier le facteur 10 de la dilution. 5,1 mL, c'est la moitié de $V_E$.
    etapes:
      - type: calcul
        titre: Réaction support
        texte: $\mathrm{CH_3COOH} + \mathrm{HO^-} \longrightarrow \mathrm{CH_3COO^-} + \mathrm{H_2O}$.
      - type: calcul
        titre: La solution diluée
        texte: $c_A = \dfrac{c_B V_E}{V_A} = \dfrac{0{,}100 \times 10{,}2}{10{,}0} = 1{,}02 \times 10^{-1}\ \mathrm{mol \cdot L^{-1}}$.
      - type: piege
        titre: Le vinaigre pur
        texte: La solution titrée était diluée 10 fois, donc $c_0 = 10\,c_A = 1{,}02\ \mathrm{mol \cdot L^{-1}}$.
      - type: methode
        titre: La demi-équivalence
        texte: >-
          À $V = V_E/2$, $[\mathrm{CH_3COOH}] = [\mathrm{CH_3COO^-}]$, donc $\mathrm{pH} = \mathrm{p}K_A$. La valeur 4,8 est le pKa du couple acide éthanoïque / ion éthanoate.
      - type: calcul
        titre: Le degré d'acidité
        texte: >-
          100 g de vinaigre occupent $100/1{,}01 \approx 99{,}0\ \mathrm{mL}$ et contiennent $n = 1{,}02 \times 0{,}0990 \approx 0{,}101\ \mathrm{mol}$ d'acide, soit $m = 0{,}101 \times 60{,}0 \approx 6{,}1\ \mathrm{g}$.
      - type: conc
        titre: Conclusion
        texte: <mark>Le vinaigre titre environ 6 degrés</mark>, en accord avec l'étiquette.
