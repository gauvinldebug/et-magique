questions:
  - question: Selon Brønsted, un acide est une espèce capable de…
    choix: ['capter un ion $\mathrm{H^+}$', 'céder un ion $\mathrm{H^+}$', 'céder un électron', 'capter un ion $\mathrm{HO^-}$']
    bonne: 1
    explication: L'acide lance le ballon, c'est-à-dire le proton $\mathrm{H^+}$. La base l'attrape.
    revoir: cours

  - question: Quelle est la base conjuguée de l'acide éthanoïque $\mathrm{CH_3COOH}$ ?
    choix: ['$\mathrm{CH_3COOH_2^+}$', '$\mathrm{CH_3COO^-}$', '$\mathrm{CH_3CO^+}$', '$\mathrm{HO^-}$']
    bonne: 1
    explication: On retire un $\mathrm{H^+}$ à l'acide, donc un H et une charge positive. On obtient l'ion éthanoate $\mathrm{CH_3COO^-}$.
    revoir: cours

  - question: Quelle écriture du couple est correcte ?
    choix: ['$\mathrm{NH_3/NH_4^+}$', '$\mathrm{NH_4^+/NH_3}$', '$\mathrm{NH_4^+/NH_2^-}$', '$\mathrm{NH_3/H^+}$']
    bonne: 1
    explication: Dans un couple, l'acide s'écrit à gauche. L'ion ammonium est l'acide, l'ammoniac sa base.
    revoir: cours

  - question: L'eau est amphotère parce que…
    choix:
      - elle conduit le courant
      - elle est l'acide d'un couple et la base d'un autre
      - son pH vaut 7
      - elle dissout les acides et les bases
    bonne: 1
    explication: L'eau est l'acide du couple $\mathrm{H_2O/HO^-}$ et la base du couple $\mathrm{H_3O^+/H_2O}$.
    revoir: cours

  - question: Une solution a un pH de 4. Que vaut $[\mathrm{H_3O^+}]$ ?
    choix: ['$4\ \mathrm{mol \cdot L^{-1}}$', '$10^{4}\ \mathrm{mol \cdot L^{-1}}$', '$10^{-4}\ \mathrm{mol \cdot L^{-1}}$', '$-4\ \mathrm{mol \cdot L^{-1}}$']
    bonne: 2
    explication: $[\mathrm{H_3O^+}] = c^\circ \times 10^{-\mathrm{pH}} = 10^{-4}\ \mathrm{mol \cdot L^{-1}}$.
    revoir: cours

  - question: La solution A a un pH de 2, la solution B un pH de 4. Que peut-on dire ?
    choix:
      - A contient 2 fois plus d'ions oxonium que B
      - A contient 100 fois plus d'ions oxonium que B
      - B est plus acide que A
      - A contient 100 fois moins d'ions oxonium que B
    bonne: 1
    explication: Deux unités de pH d'écart, c'est un facteur $10^2 = 100$. Plus le pH est bas, plus la solution est acide.
    revoir: cours

  - question: On dilue 10 fois une solution d'acide chlorhydrique de pH 2. Le nouveau pH vaut…
    choix: ['$0{,}2$', '$1$', '$3$', '$20$']
    bonne: 2
    explication: La concentration est divisée par 10, le pH augmente de 1. C'est le piège classique du chapitre.
    revoir: exercices

  - question: Dans l'équation d'une réaction acide-base, l'ion $\mathrm{H^+}$…
    choix:
      - apparaît à gauche
      - apparaît à droite
      - apparaît des deux côtés
      - n'apparaît pas
    bonne: 3
    explication: Le proton passe d'un réactif à l'autre. Il figure dans les demi-équations, puis s'élimine quand on les additionne.
    revoir: cours
