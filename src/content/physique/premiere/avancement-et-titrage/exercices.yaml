exercices:
  - titre: Trouver le réactif limitant
    difficulte: 1
    type: methode
    enonce: |
      On fait brûler 0,30 mol de méthane dans 0,50 mol de dioxygène : $\mathrm{CH_4} + 2\,\mathrm{O_2} \longrightarrow \mathrm{CO_2} + 2\,\mathrm{H_2O}$. La transformation est totale.
      Déterminer le réactif limitant et la composition finale.
    indice: Compare $0{,}30/1$ et $0{,}50/2$.
    etapes:
      - type: calcul
        titre: Les deux hypothèses
        texte: Si $\mathrm{CH_4}$ est limitant, $x_{\max} = 0{,}30$ mol ; si $\mathrm{O_2}$ l'est, $x_{\max} = 0{,}50/2 = 0{,}25$ mol.
      - type: methode
        titre: Le plus petit gagne
        texte: $x_{\max} = 0{,}25$ mol, le dioxygène est limitant.
      - type: conc
        titre: État final
        texte: <mark>$n(\mathrm{CH_4}) = 0{,}05$ mol, $n(\mathrm{O_2}) = 0$, $n(\mathrm{CO_2}) = 0{,}25$ mol, $n(\mathrm{H_2O}) = 0{,}50$ mol</mark>.

  - titre: Le piège de la petite quantité
    difficulte: 2
    type: piege
    enonce: |
      Pour $2\,\mathrm{Al} + 3\,\mathrm{S} \longrightarrow \mathrm{Al_2S_3}$, on dispose de 0,40 mol d'aluminium et de 0,45 mol de soufre. Un élève dit que l'aluminium est limitant car il est en plus petite quantité. Vérifier.
    indice: Les sandwichs, encore. Combien de « recettes » permet chaque réactif ?
    etapes:
      - type: calcul
        titre: Les recettes possibles
        texte: Aluminium, $0{,}40/2 = 0{,}20$ mol ; soufre, $0{,}45/3 = 0{,}15$ mol.
      - type: piege
        titre: L'erreur
        texte: C'est le soufre qui donne la plus petite valeur. La recette en demande 3 pour 2 aluminium.
      - type: conc
        titre: Conclusion
        texte: <mark>Le soufre est limitant, $x_{\max} = 0{,}15$ mol</mark>. Il reste $0{,}40 - 0{,}30 = 0{,}10$ mol d'aluminium.

  - titre: Mélange stœchiométrique
    difficulte: 1
    type: application
    enonce: |
      Quelle quantité de dioxygène faut-il pour brûler exactement 0,20 mol d'éthanol, sans excès ? $\mathrm{C_2H_6O} + 3\,\mathrm{O_2} \longrightarrow 2\,\mathrm{CO_2} + 3\,\mathrm{H_2O}$.
    indice: Proportions stœchiométriques, $n(\mathrm{O_2})/3 = n(\text{éthanol})/1$.
    etapes:
      - type: conc
        titre: Le calcul
        texte: <mark>$n(\mathrm{O_2}) = 3 \times 0{,}20 = 0{,}60$ mol</mark>.

  - titre: Titrer l'eau oxygénée
    difficulte: 2
    type: methode
    enonce: |
      On titre $V_1 = 10{,}0$ mL d'eau oxygénée diluée par une solution de permanganate de potassium à $c_2 = 2{,}0 \times 10^{-2}\ \mathrm{mol \cdot L^{-1}}$. Réaction support :
      $$2\,\mathrm{MnO_4^-} + 5\,\mathrm{H_2O_2} + 6\,\mathrm{H^+} \longrightarrow 2\,\mathrm{Mn^{2+}} + 5\,\mathrm{O_2} + 8\,\mathrm{H_2O}$$
      La teinte violette persiste à partir de $V_E = 12{,}0$ mL. Calculer $c_1$.
    indice: $\dfrac{n(\mathrm{H_2O_2})}{5} = \dfrac{n(\mathrm{MnO_4^-})_E}{2}$.
    etapes:
      - type: methode
        titre: L'équivalence
        texte: Avant $V_E$, le permanganate est limitant et se décolore. À l'équivalence, $\dfrac{c_1 V_1}{5} = \dfrac{c_2 V_E}{2}$.
      - type: conc
        titre: Le calcul
        texte: <mark>$c_1 = \dfrac{5\,c_2\,V_E}{2\,V_1} = \dfrac{5 \times 2{,}0 \times 10^{-2} \times 12{,}0}{2 \times 10{,}0} = 6{,}0 \times 10^{-2}\ \mathrm{mol \cdot L^{-1}}$</mark>.

  - titre: La vitamine C d'un comprimé
    difficulte: 3
    type: bac
    enonce: |
      On dissout un comprimé de vitamine C (acide ascorbique, $\mathrm{C_6H_8O_6}$, $M = 176\ \mathrm{g \cdot mol^{-1}}$) dans 100,0 mL d'eau. On en titre 10,0 mL par une solution de diiode à $c = 1{,}0 \times 10^{-2}\ \mathrm{mol \cdot L^{-1}}$, avec de l'empois d'amidon (bleu en présence de diiode). Réaction : $\mathrm{C_6H_8O_6} + \mathrm{I_2} \longrightarrow \mathrm{C_6H_6O_6} + 2\,\mathrm{I^-} + 2\,\mathrm{H^+}$. La solution devient bleue pour $V_E = 14{,}2$ mL.
      Calculer la masse de vitamine C dans le comprimé. L'étiquette annonce 250 mg : commenter.
    indice: Quantité dans 10 mL, puis dans 100 mL.
    etapes:
      - type: methode
        titre: L'équivalence
        texte: Le bleu apparaît à la première goutte de diiode en excès. Coefficients 1 et 1, donc $n_{\text{titrée}} = c\,V_E = 1{,}0 \times 10^{-2} \times 14{,}2 \times 10^{-3} = 1{,}42 \times 10^{-4}$ mol.
      - type: piege
        titre: La prise d'essai
        texte: On n'a titré que 10,0 mL sur 100,0 mL. Le comprimé contient 10 fois plus, $1{,}42 \times 10^{-3}$ mol.
      - type: calcul
        titre: La masse
        texte: $m = 1{,}42 \times 10^{-3} \times 176 \approx 0{,}250$ g.
      - type: conc
        titre: Conclusion
        texte: <mark>Environ 250 mg, en accord avec l'étiquette</mark>.
