exercices:
  - titre: Combien d'électrons ?
    difficulte: 1
    type: application
    enonce: |
      Une lampe est traversée par un courant $I = 0{,}20\ \mathrm{A}$ pendant 1 minute. Calculer la charge qui l'a traversée, puis le nombre d'électrons correspondant.
    indice: $Q = I\,\Delta t$, et chaque électron porte $e$.
    etapes:
      - type: calcul
        titre: La charge
        texte: $Q = 0{,}20 \times 60 = 12\ \mathrm{C}$.
      - type: conc
        titre: Les électrons
        texte: <mark>$N = Q/e = 12 / 1{,}6 \times 10^{-19} = 7{,}5 \times 10^{19}$ électrons</mark>.

  - titre: La pile qui faiblit
    difficulte: 2
    type: application
    enonce: |
      Une pile a une force électromotrice $E = 4{,}5\ \mathrm{V}$ et une résistance interne $r = 1{,}5\ \Omega$. Elle débite $I = 0{,}30\ \mathrm{A}$.
      1. Calculer la tension à ses bornes.
      2. Calculer la puissance fournie au circuit, la puissance perdue dans la pile, et le rendement de la pile.
    indice: $U = E - rI$, puis le bilan.
    etapes:
      - type: calcul
        titre: La tension
        texte: $U_{PN} = 4{,}5 - 1{,}5 \times 0{,}30 = 4{,}05\ \mathrm{V}$.
      - type: calcul
        titre: Les puissances
        texte: Totale $EI = 1{,}35\ \mathrm{W}$. Utile $U_{PN}I \approx 1{,}22\ \mathrm{W}$. Perdue $rI^2 = 1{,}5 \times 0{,}09 \approx 0{,}14\ \mathrm{W}$.
      - type: conc
        titre: Le rendement
        texte: <mark>$\eta = 1{,}22/1{,}35 \approx 0{,}90$</mark>, soit 90 %.

  - titre: La bouilloire et la facture
    difficulte: 2
    type: piege
    enonce: |
      Une bouilloire de puissance 2000 W fonctionne 3 minutes. Un élève calcule l'énergie : $2000 \times 3 = 6000\ \mathrm{J}$. Corriger, puis exprimer le résultat en kWh.
    indice: Quelle unité de temps pour obtenir des joules ?
    etapes:
      - type: piege
        titre: L'erreur
        texte: La durée doit être en secondes pour obtenir des joules. 3 minutes, c'est 180 s.
      - type: calcul
        titre: Le bon calcul
        texte: $\mathcal{E} = 2000 \times 180 = 3{,}6 \times 10^{5}\ \mathrm{J}$.
      - type: conc
        titre: En kilowattheures
        texte: $\mathcal{E} = 2{,}0\ \mathrm{kW} \times 0{,}05\ \mathrm{h}$, <mark>soit 0,10 kWh</mark>.

  - titre: Le rendement d'un moteur
    difficulte: 3
    type: bac
    enonce: |
      Un petit moteur alimenté sous $U = 12\ \mathrm{V}$ est traversé par $I = 2{,}0\ \mathrm{A}$. Il soulève une charge et fournit une puissance mécanique de 18 W.
      1. Calculer la puissance électrique reçue.
      2. Faire le bilan de puissance et calculer le rendement.
      3. On attribue les pertes à l'effet Joule dans le bobinage. Calculer la résistance du bobinage.
    indice: Les pertes sont la différence entre reçue et utile.
    etapes:
      - type: calcul
        titre: Puissance reçue
        texte: $P_e = UI = 12 \times 2{,}0 = 24\ \mathrm{W}$.
      - type: calcul
        titre: Bilan
        texte: $P_{\text{perdue}} = 24 - 18 = 6{,}0\ \mathrm{W}$, et $\eta = 18/24 = 0{,}75$.
      - type: calcul
        titre: La résistance
        texte: $P_J = RI^2$ donc $R = 6{,}0 / 2{,}0^2 = 1{,}5\ \Omega$.
      - type: conc
        titre: Conclusion
        texte: <mark>Rendement de 75 %, et un bobinage de 1,5 Ω</mark> qui chauffe le moteur.
