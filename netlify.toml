[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# mathsetmagique.fr (et www) renvoie vers etmagique.fr/maths
[[redirects]]
  from = "https://mathsetmagique.fr/*"
  to = "https://etmagique.fr/maths/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.mathsetmagique.fr/*"
  to = "https://etmagique.fr/maths/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.etmagique.fr/*"
  to = "https://etmagique.fr/:splat"
  status = 301
  force = true

# Liens courts pour les descriptions YouTube et les QR codes (avec étiquette de provenance)
[[redirects]]
  from = "/r/:niveau/:chapitre"
  to = "/maths/:niveau/:chapitre/?utm_source=youtube&utm_medium=description"
  status = 302

[[redirects]]
  from = "/qr/:niveau/:chapitre"
  to = "/maths/:niveau/:chapitre/?utm_source=youtube&utm_medium=qr"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Frame-Options = "DENY"
